name: Zack frontend checks

on:
  push:
    branches:
      - preparation/phase-1-frontend-plan
      - hardening/phase-1-stabilisation
  pull_request:
    branches:
      - preparation/phase-1-frontend-plan
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zack-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security guardrail tests
        run: npm test
      - name: Build and type-check
        run: npm run build
