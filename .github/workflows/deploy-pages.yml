name: Zack — mise en ligne de test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zack-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publier la version de test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe JavaScript du frontend
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('Aucun script JavaScript intégré trouvé.');
          scripts.forEach((source, index) => new vm.Script(source, { filename: `index.html:inline-script-${index + 1}` }));
          console.log(`Syntaxe valide : ${scripts.length} script(s) JavaScript.`);
          NODE

      - name: Préparer GitHub Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Charger le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déployer la version de test
        id: deployment
        uses: actions/deploy-pages@v4
