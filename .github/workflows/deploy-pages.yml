name: Zack — mise en ligne de test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zack-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publier la version de test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe JavaScript du frontend
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('Aucun script JavaScript intégré trouvé.');
          scripts.forEach((source, index) => new vm.Script(source, { filename: `index.html:inline-script-${index + 1}` }));
          console.log(`Syntaxe valide : ${scripts.length} script(s) JavaScript.`);
          NODE

      - name: Vérifier les ressources PWA
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !manifest.scope || manifest.display !== 'standalone') {
            throw new Error('Le manifeste PWA est incomplet.');
          }
          for (const icon of manifest.icons || []) {
            if (!fs.existsSync(icon.src.replace(/^\.\//, ''))) {
              throw new Error(`Icône PWA introuvable : ${icon.src}`);
            }
          }
          if (!fs.existsSync('sw.js')) throw new Error('Service Worker sw.js introuvable.');
          console.log('Manifeste, icônes et Service Worker présents.');
          NODE

      - name: Préparer GitHub Pages
        run: |
          mkdir -p _site/icons
          cp index.html _site/index.html
          cp manifest.webmanifest sw.js _site/
          cp icons/zack-icon.svg _site/icons/
          touch _site/.nojekyll

      - name: Charger le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déployer la version de test
        id: deployment
        uses: actions/deploy-pages@v4
