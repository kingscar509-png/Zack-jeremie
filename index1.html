<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1A4F" />
  <meta name="application-name" content="Zack Haïti" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zack Haïti" />
  <!-- Préparation PWA : l'installation réelle sur mobile requiert un fichier manifest.webmanifest et un Service Worker (sw.js) servis en HTTPS lors du déploiement. -->
  <title>Zack Haïti — Annuaire & plateforme numérique nationale des entreprises</title>
  <meta name="description" content="Zack connecte les entreprises, commerces, artisans et services des 10 départements d'Haïti avec les consommateurs : recherche locale, fiches détaillées, produits, promotions et événements." />
  <meta property="og:title" content="Zack Haïti — Plateforme numérique nationale des entreprises" />
  <meta property="og:description" content="Découvrez les entreprises, produits et services partout en Haïti (10 départements, communes et quartiers)." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_HT" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A1A4F;
      --navy-hover: #102770;
      --blue: #3B82F6;
      --blue-soft: rgba(59, 130, 246, 0.11);
      --yellow: #FFC107;
      --yellow-hover: #F5B400;
      --yellow-text: #0A1A4F;

      --outer-bg: #E9EEF7;
      --bg: #F6F8FC;
      --surface: #FFFFFF;
      --surface-alt: #F1F5F9;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text: #0F172A;
      --text-muted: #475569;
      --text-subtle: #64748B;

      --success: #15803D;
      --success-bg: rgba(21, 128, 61, 0.12);
      --warning: #B45309;
      --warning-bg: rgba(180, 83, 9, 0.12);
      --danger: #B91C1C;
      --danger-bg: rgba(185, 28, 28, 0.12);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 3px rgba(10, 26, 79, 0.06);
      --shadow-shell: 0 20px 50px rgba(10, 26, 79, 0.18);
    }

    html.dark {
      --outer-bg: #030712;
      --bg: #070C1B;
      --surface: #0F172A;
      --surface-alt: #162036;
      --border: #1E293B;
      --border-strong: #334155;
      --text: #F8FAFC;
      --text-muted: #CBD5E1;
      --text-subtle: #94A3B8;
      --blue-soft: rgba(59, 130, 246, 0.18);
      --success: #4ADE80;
      --success-bg: rgba(74, 222, 128, 0.14);
      --warning: #FBBF24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --danger: #F87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-shell: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--outer-bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Desktop outer bar */
    .desktop-toolbar { display: none; }
    @media (min-width: 640px) {
      .desktop-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        max-width: 1240px;
        margin: 10px auto 0;
        padding: 8px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        font-size: 0.78rem;
      }
      body { padding: 0 14px 16px; }
    }

    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .seg-control {
      display: inline-flex;
      background: var(--surface-alt);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }
    .seg-btn {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .seg-btn.active { background: var(--navy); color: #FFFFFF; font-weight: 600; }
    html.dark .seg-btn.active { background: var(--blue); }

    /* App Shell: native page scroll on phone, bounded 9:16 / desktop frame on >= 640px */
    .app-shell {
      width: 100%;
      max-width: 100%;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 640px) {
      .app-shell.mode-916 {
        width: 100%;
        max-width: 412px;
        height: min(760px, calc(100vh - 88px));
        min-height: 620px;
        margin: 12px auto 0;
        border-radius: 28px;
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-shell);
        overflow: hidden;
      }
      .app-shell.mode-desktop {
        max-width: 1240px;
        height: calc(100vh - 88px);
        margin: 12px auto 0;
        border-radius: 18px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-shell);
        overflow: hidden;
      }
    }

    /* Header */
    .app-header {
      flex-shrink: 0;
      height: 54px;
      padding: 0 12px;
      background: var(--navy);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-title { font-size: 0.96rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--yellow); color: var(--navy);
      display: grid; place-items: center; font-weight: 700; font-size: 1rem; flex-shrink: 0;
    }
    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.11); color: #FFFFFF;
      position: relative; flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .lang-pill-btn {
      height: 30px; padding: 0 8px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.14); color: #FFFFFF;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
    }
    .badge-dot {
      position: absolute; top: 2px; right: 2px;
      min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px;
      background: var(--yellow); color: var(--navy);
      font-size: 0.62rem; font-weight: 700; display: grid; place-items: center;
    }

    /* Body */
    .screen-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 15px 15px 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 640px) {
      .screen-body {
        flex: 1 1 0%;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
    }
    .app-shell.mode-desktop .screen-body { padding: 24px 24px 100px; }
    .screen-body > * { min-width: 0; flex-shrink: 0; }

    /* Floating Detached Bottom Dock */
    .bottom-nav {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 392px;
      height: 60px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(10, 26, 79, 0.22);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0 4px;
      z-index: 45;
    }
    @media (min-width: 640px) {
      .bottom-nav {
        position: absolute;
        bottom: 12px;
      }
      .app-shell.mode-desktop .bottom-nav {
        max-width: 500px;
      }
    }
    html.dark .bottom-nav {
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }
    .bottom-nav.hidden { display: none; }
    .bnav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 0.68rem; font-weight: 500; color: var(--text-subtle); min-width: 0; min-height: 44px;
    }
    .bnav-btn.active { color: var(--blue); font-weight: 600; }
    .bnav-fab {
      width: 40px; height: 40px; border-radius: 13px;
      background: var(--yellow); color: var(--navy); display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.45);
    }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      min-width: 0;
    }
    .card-pad { padding: 15px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .section-title { font-size: 0.98rem; font-weight: 700; }
    .link-more { font-size: 0.78rem; font-weight: 600; color: var(--blue); white-space: nowrap; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .grid-prods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .app-shell.mode-desktop .grid-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .app-shell.mode-desktop .grid-prods { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .app-shell.mode-desktop .cat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .app-shell.mode-desktop .narrow-wrap { width: 100%; max-width: 520px; margin: 0 auto; }
    .app-shell.mode-desktop .detail-two-col { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 16px; align-items: start; }

    .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .story-biz { width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
    .story-avatar {
      width: 58px; height: 58px; border-radius: 16px;
      display: grid; place-items: center; color: #FFFFFF; font-weight: 700; font-size: 1rem;
      border: 2px solid var(--surface); box-shadow: var(--shadow-sm);
      overflow: hidden; background-size: cover; background-position: center;
    }
    .story-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .story-name { font-size: 0.72rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 40px; padding: 8px 13px; border-radius: var(--radius-sm);
      font-size: 0.84rem; font-weight: 600; white-space: nowrap;
      transition: transform 120ms ease, background 150ms ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 33px; padding: 5px 10px; font-size: 0.76rem; }
    .btn-block { width: 100%; }
    .btn-navy { background: var(--navy); color: #FFFFFF; }
    .btn-primary { background: var(--blue); color: #FFFFFF; }
    .btn-yellow { background: var(--yellow); color: var(--yellow-text); }
    .btn-outline { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); }
    .btn-danger { background: var(--danger); color: #FFFFFF; }
    .btn-success { background: var(--success); color: #FFFFFF; }

    /* Forms */
    .form-stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field label { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); }
    .input, .select, .textarea {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 9px 11px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 0.85rem;
    }
    .textarea { min-height: 78px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .home-search {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 5px 10px; min-height: 44px; width: 100%;
    }
    .home-search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 0.86rem; }

    .hero-banner {
      background: linear-gradient(130deg, var(--navy) 0%, #173694 65%, #2563EB 100%);
      color: #FFFFFF; border-radius: var(--radius-lg); padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .hero-banner h1 { font-size: 1.2rem; line-height: 1.28; font-weight: 700; }
    .hero-banner p { font-size: 0.8rem; color: rgba(255, 255, 255, 0.86); }

    .tabs-bar {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
      border-bottom: 1px solid var(--border); scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      padding: 8px 11px; font-size: 0.8rem; font-weight: 600;
      color: var(--text-subtle); border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0;
    }
    .tab-item.active { color: var(--blue); border-bottom-color: var(--blue); }

    .menu-list { display: flex; flex-direction: column; }
    .menu-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 13px 15px; min-height: 48px; border-bottom: 1px solid var(--border);
      text-align: left; width: 100%; background: var(--surface);
    }
    .menu-row:last-child { border-bottom: none; }
    .menu-row:hover { background: var(--surface-alt); }
    .menu-row-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }

    /* Media & Image Upload Galleries */
    .media-box {
      width: 100%; height: 110px; background: var(--surface-alt);
      display: grid; place-items: center; overflow: hidden; position: relative;
    }
    .media-box img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-strip { display: flex; gap: 8px; flex-wrap: wrap; }
    .thumb-item {
      width: 68px; height: 68px; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border-strong); position: relative; background: var(--surface-alt);
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-del {
      position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
      border-radius: 999px; background: rgba(10, 26, 79, 0.85); color: #fff;
      font-size: 0.7rem; font-weight: 700; display: grid; place-items: center;
    }
    .upload-zone {
      border: 1.5px dashed var(--border-strong); border-radius: 10px;
      padding: 12px; text-align: center; background: var(--surface-alt);
      cursor: pointer; display: block; font-size: 0.8rem;
    }
    .upload-zone input { display: none; }

    /* Cover banners for profiles */
    .cover-area {
      height: 122px; width: 100%; position: relative; padding: 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
      background-size: cover; background-position: center; overflow: hidden;
    }
    .cover-area img.cover-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
    }
    .cover-area > *:not(.cover-img) { position: relative; z-index: 1; }

    .meta { font-size: 0.74rem; color: var(--text-subtle); display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .small { font-size: 0.78rem; }
    .muted { color: var(--text-subtle); }
    .price-htg { font-weight: 700; color: var(--navy); font-size: 0.94rem; }
    html.dark .price-htg { color: var(--yellow); }
    .status-ok { color: var(--success); font-weight: 600; font-size: 0.76rem; }
    .status-warn { color: var(--warning); font-weight: 600; font-size: 0.76rem; }
    .status-bad { color: var(--danger); font-weight: 600; font-size: 0.76rem; }

    .notice {
      padding: 11px 13px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface-alt);
      font-size: 0.78rem; color: var(--text-muted);
    }
    .notice-warn { border-color: rgba(180, 83, 9, 0.35); background: var(--warning-bg); color: var(--text); }
    .notice-info { border-color: rgba(59, 130, 246, 0.35); background: var(--blue-soft); color: var(--text); }

    .chat-feed { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .bubble { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 0.83rem; line-height: 1.45; }
    .bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
    .bubble.me { align-self: flex-end; background: var(--navy); color: #FFFFFF; }
    html.dark .bubble.me { background: var(--blue); }
    .bubble-time { font-size: 0.68rem; opacity: 0.72; margin-top: 4px; text-align: right; }

    .drawer-overlay {
      position: fixed; inset: 0; z-index: 60; background: rgba(7, 12, 27, 0.6);
      display: none; align-items: flex-end; justify-content: center; padding: 12px;
    }
    .drawer-overlay.open { display: flex; }
    @media (min-width: 640px) { .drawer-overlay { align-items: center; } }
    .drawer-sheet {
      width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px; box-shadow: var(--shadow-shell);
    }

    .toast-box {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
      z-index: 80; width: calc(100% - 32px); max-width: 350px;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .toast {
      background: var(--navy); color: #FFFFFF; padding: 10px 14px;
      border-radius: 10px; font-size: 0.8rem; font-weight: 500; text-align: center;
      box-shadow: var(--shadow-shell);
    }

    .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .divider { height: 1px; background: var(--border); margin: 10px 0; }

    /* Badges vérifiés, catégories, filtres, états */
    .verified-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 6px;
      background: var(--blue-soft); color: var(--blue);
      font-size: 0.7rem; font-weight: 700; white-space: nowrap;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px;
      font-size: 0.72rem; font-weight: 600; white-space: nowrap;
    }
    .status-pill.ok { background: var(--success-bg); color: var(--success); }
    .status-pill.warn { background: var(--warning-bg); color: var(--warning); }
    .status-pill.bad { background: var(--danger-bg); color: var(--danger); }

    .cat-tile {
      display: flex; align-items: center; gap: 9px; text-align: left;
      padding: 10px 11px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      min-height: 48px; transition: border-color 150ms ease, background 150ms ease;
    }
    .cat-tile:hover, .cat-tile.active { border-color: var(--blue); background: var(--blue-soft); }
    .cat-ico {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: grid; place-items: center; background: var(--surface-alt); color: var(--navy);
    }
    html.dark .cat-ico { color: var(--yellow); }

    .filter-strip {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
    }
    .filter-strip::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 6px 11px; border-radius: 8px; font-size: 0.76rem; font-weight: 600;
      background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted);
      white-space: nowrap; flex-shrink: 0; min-height: 34px;
    }
    .filter-btn.active { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
    html.dark .filter-btn.active { background: var(--blue); border-color: var(--blue); }

    .skeleton-card {
      height: 86px; border-radius: var(--radius-md);
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-alt) 50%, var(--surface) 75%);
      background-size: 200% 100%; animation: skel 1.1s infinite linear;
      border: 1px solid var(--border);

         4. UTILITAIRES & PERMISSIONS
         ========================================================= */
      function esc(s) {
        if (s === null || s === undefined) return "";
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function safeUrl(u) {
        if (!u) return "";
        const raw = String(u).trim();
        if (!raw) return "";
        try {
          const parsed = new URL(raw);
          if (parsed.protocol === "https:" || parsed.protocol === "http:") return parsed.href;
        } catch (_) {}
        return "";
      }
      function safeImgUrl(u) {
        if (!u) return "";
        const s = String(u).trim();
        if (s.startsWith("data:image/")) return s;
        try {
          const parsed = new URL(s);
          if (parsed.protocol === "https:") return parsed.href;
        } catch (_) {}
        return "";
      }
      function safeTel(p) {
        return String(p || "").replace(/[^\d+]/g, "");
      }
      function safeDigits(p) {
        return String(p || "").replace(/\D/g, "");
      }
      function statusBadge(status) {
        if (status === "verified") {
          return `<span class="status-pill ok">✓ ${STATE.lang === "ht" ? "Antrepriz verifye" : "Entreprise vérifiée"}</span>`;
        }
        if (status === "suspended") {
          return `<span class="status-pill bad">⚠ ${STATE.lang === "ht" ? "Sispann" : "Suspendue"}</span>`;
        }
        return `<span class="status-pill warn">⏳ ${STATE.lang === "ht" ? "Ap tann verifikasyon" : "En attente de vérification"}</span>`;
      }
      function money(htg) {
        const v = Number(htg) || 0;
        const h = v.toLocaleString("fr-FR") + " HTG";
        const u = "$" + (v / STATE.exchangeRate).toFixed(2) + " USD";
        if (STATE.currency === "USD") return `<span class="tabular">${u}</span>`;
        if (STATE.currency === "BOTH") return `<span class="tabular">${h}</span> <span class="small muted tabular">(${u})</span>`;
        return `<span class="tabular">${h}</span>`;
      }
      function toast(msg) {
        const box = document.getElementById("toastBox");
        const el = document.createElement("div");
        el.className = "toast"; el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }

      function getCatName(id) { const c = STATE.categories.find((x) => x.id === id); return c ? c.name : id; }

      function readFileAsDataUrl(file, cb) {
        if (!file || !file.type || !file.type.startsWith("image/")) {
          toast("Veuillez sélectionner un fichier image valide (JPG, PNG, WebP).");
          return;
        }
        if (file.size > 4 * 1024 * 1024) {
          toast("Image trop lourde (max 4 Mo).");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => cb(reader.result);
        reader.onerror = () => toast("Erreur de lecture de l'image.");
        reader.readAsDataURL(file);
      }

      function computeExploreMatches() {
        const q = STATE.searchQuery.trim().toLowerCase();
        let bizList = STATE.businesses.filter((b) => b.status === "verified");
        if (STATE.filterDept) bizList = bizList.filter((b) => b.dept === STATE.filterDept);
        if (STATE.filterCommune) bizList = bizList.filter((b) => b.commune === STATE.filterCommune);
        if (STATE.filterQuartier) bizList = bizList.filter((b) => b.quartier === STATE.filterQuartier);
        if (STATE.filterCategory) bizList = bizList.filter((b) => b.categoryId === STATE.filterCategory);
        if (q) {
          bizList = bizList.filter((b) =>
            b.name.toLowerCase().includes(q) ||
            (b.subCategory || "").toLowerCase().includes(q) ||
            b.shortDesc.toLowerCase().includes(q) ||
            getCatName(b.categoryId).toLowerCase().includes(q) ||
            b.commune.toLowerCase().includes(q) ||
            b.quartier.toLowerCase().includes(q) ||
            b.dept.toLowerCase().includes(q)
          );
        }

        if (STATE.exploreSort === "rating") bizList.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        else if (STATE.exploreSort === "newest") bizList.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
        else if (STATE.exploreSort === "name") bizList.sort((a, b) => a.name.localeCompare(b.name, "fr"));

        const matchesBizFilters = (bz) => {
          if (!bz || bz.status !== "verified") return false;
          if (STATE.filterDept && bz.dept !== STATE.filterDept) return false;
          if (STATE.filterCommune && bz.commune !== STATE.filterCommune) return false;
          if (STATE.filterQuartier && bz.quartier !== STATE.filterQuartier) return false;
          if (STATE.filterCategory && bz.categoryId !== STATE.filterCategory) return false;
          return true;
        };

        const prodList = STATE.products.filter((p) => {
          const bz = getBiz(p.bizId);
          if (!matchesBizFilters(bz)) return false;
          if (q && !(p.name.toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q) || bz.name.toLowerCase().includes(q) || bz.commune.toLowerCase().includes(q))) return false;
          return true;
        });

        const srvList = STATE.services.filter((s) => {
          const bz = getBiz(s.bizId);
          if (!matchesBizFilters(bz)) return false;
          if (q && !(s.name.toLowerCase().includes(q) || (s.desc || "").toLowerCase().includes(q) || bz.name.toLowerCase().includes(q) || bz.commune.toLowerCase().includes(q))) return false;
          return true;
        });

        return { bizList, prodList, srvList };
      }

        return `
          <div class="card">

      function viewCart() {
        const lines = STATE.cart.map((c) => { const p = STATE.products.find((x) => x.id === c.prodId); return p ? { ...c, p } : null; }).filter(Boolean);
        const total = lines.reduce((s, l) => s + l.qty * l.p.priceHtg, 0);
        if (!lines.length) return `<div class="card card-pad" style="text-align:center;"><p class="small muted" style="margin-bottom:12px;">Votre panier est vide.</p><button type="button" class="btn btn-navy" onclick="app.switchRoot('explore')">Explorer le catalogue</button></div>`;
        return `
          <div class="notice notice-warn">
            <strong>Interface préparatoire :</strong> les commandes enregistrées ici restent locales à cette session. La confirmation réelle, le paiement et le suivi nécessiteront Supabase et un backend sécurisé.
          </div>
          <div class="card card-pad form-stack">
            ${lines.map((l) => `
              <div class="flex-between">
                <div><strong class="small">${esc(l.p.name)}</strong><div class="small muted">${l.qty} × ${l.p.priceHtg} HTG</div></div>
                <div class="flex-row">
                  <button type="button" class="btn btn-outline btn-sm" aria-label="Diminuer quantité" onclick="app.changeCartQty('${l.p.id}', -1)">−</button>
                  <button type="button" class="btn btn-outline btn-sm" aria-label="Augmenter quantité" onclick="app.changeCartQty('${l.p.id}', 1)">+</button>
                  <button type="button" class="btn btn-outline btn-sm" onclick="app.removeFromCart('${l.p.id}')">Retirer</button>
                </div>
              </div>
            `).join("")}
            <div class="flex-between" style="font-weight:700;"><span>Total estimé</span><span>${money(total)}</span></div>
          </div>
          <form class="card card-pad form-stack" onsubmit="app.placeOrder(event)">
            <div class="field"><label for="oName">Nom complet</label><input id="oName" class="input" required value="${esc(STATE.user ? STATE.user.name : '')}" /></div>
            <div class="field"><label for="oPhone">Téléphone</label><input id="oPhone" class="input" required value="${esc(STATE.user ? STATE.user.phone : '')}" /></div>
            <div class="field"><label for="oMode">Mode</label><select id="oMode" class="select"><option>Livraison</option><option>Retrait sur place</option></select></div>
            <div class="field"><label for="oAddr">Adresse complète</label><input id="oAddr" class="input" required value="${esc(STATE.user ? STATE.user.commune + ', ' + STATE.user.dept : '')}" /></div>
            <button type="submit" class="btn btn-yellow btn-block">Enregistrer la demande (aperçu)</button>
          </form>
        `;
      }

        useGeolocation() {
          if (!navigator.geolocation) {
            STATE.exploreError = "La géolocalisation n'est pas prise en charge par votre navigateur.";
            render();
            return;
          }
          STATE.exploreError = "";
          STATE.exploreLoading = true;
          render();
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              STATE.exploreLoading = false;
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              let detectedDept = "";
              if (lat >= 18.0 && lat <= 20.2 && lng >= -74.6 && lng <= -71.5) {
                if (lat > 19.45 && lng > -72.55) detectedDept = "Nord";
                else if (lat > 19.45 && lng <= -72.55) detectedDept = "Nord-Ouest";
                else if (lat > 18.8 && lng <= -72.25) detectedDept = "Artibonite";
                else if (lat > 18.75 && lng > -72.25) detectedDept = "Centre";
                else if (lng < -73.75 && lat >= 18.45) detectedDept = "Grand'Anse";
                else if (lng < -73.0 && lat >= 18.38) detectedDept = "Nippes";
                else if (lng < -73.15 && lat < 18.38) detectedDept = "Sud";
                else if (lat < 18.42 && lng >= -72.9) detectedDept = "Sud-Est";
                else detectedDept = "Ouest";
              }
              if (detectedDept) {
                STATE.filterDept = detectedDept;
                STATE.filterCommune = "";
                STATE.filterQuartier = "";
                toast("Position détectée : " + detectedDept);
              } else {
                toast("Position détectée hors d'Haïti : sélectionnez un département manuellement.");
              }
              render();
            },
            () => {
              STATE.exploreLoading = false;
              STATE.exploreError = "Autorisation GPS refusée ou signal indisponible. Vous pouvez filtrer par département ci-dessus.";
              render();
            },
            { timeout: 6000 }
          );
        },

          toast("Service publié (aperçu local) !");
          this.back();
        },
        addPromo(e, bizId) {
          e.preventDefault();
          STATE.promotions.unshift({ id: "prm-" + Date.now(), bizId, title: document.getElementById("nprmTitle").value.trim(), oldHtg: Number(document.getElementById("nprmOld").value), newHtg: Number(document.getElementById("nprmNew").value), start: "2026-11-12", end: document.getElementById("nprmEnd").value, conditions: document.getElementById("nprmCond").value.trim(), images: [...STATE.draftImages] });
          STATE.draftImages = [];
          toast("Promotion ajoutée (aperçu local) !");
          this.open("promos");
        },
        addEvent(e, bizId) {
          e.preventDefault();
          STATE.events.unshift({ id: "evt-" + Date.now(), bizId, title: document.getElementById("nevTitle").value.trim(), date: document.getElementById("nevDate").value, time: document.getElementById("nevTime").value, place: document.getElementById("nevPlace").value.trim(), desc: document.getElementById("nevDesc").value.trim(), images: [...STATE.draftImages] });
          STATE.draftImages = [];
          toast("Événement publié (aperçu local) !");
          this.open("events");
        },
        toggleProdAvail(id) {
          const p = STATE.products.find((x) => x.id === id);
          if (!p) return;
          p.available = !p.available;
          toast(p.available ? "Produit marqué disponible." : "Produit marqué indisponible.");
          render();
        },
        deleteProd(id) {
          STATE.products = STATE.products.filter((x) => x.id !== id);
          STATE.cart = STATE.cart.filter((c) => c.prodId !== id);
          toast("Produit supprimé.");
          render();
        },
        deleteSrv(id) {
          STATE.services = STATE.services.filter((x) => x.id !== id);
          toast("Service supprimé.");
          render();
        },

        saveBizId(e, bizId) {
          e.preventDefault();
          const b = getBiz(bizId);
          if (!b) return;
          const webRaw = document.getElementById("edWeb").value.trim();
          const fbRaw = document.getElementById("edFb").value.trim();
          const igRaw = document.getElementById("edIg").value.trim();
          if ((webRaw && !safeUrl(webRaw)) || (fbRaw && !safeUrl(fbRaw)) || (igRaw && !safeUrl(igRaw))) {
            toast("Les URLs doivent commencer par https:// ou http://.");
            return;
          }
          b.name = document.getElementById("edName").value.trim();
          b.categoryId = document.getElementById("edCat").value;
          b.subCategory = document.getElementById("edSub").value.trim();
          b.shortDesc = document.getElementById("edShort").value.trim();
          b.longDesc = document.getElementById("edLong").value.trim();
          b.dept = document.getElementById("edDept").value;
          b.commune = document.getElementById("edComm").value.trim();
          b.city = b.commune;
          b.quartier = document.getElementById("edQuart").value.trim();
          b.address = document.getElementById("edAddr").value.trim();
          b.phone = document.getElementById("edPhone").value.trim();
          b.whatsapp = safeDigits(document.getElementById("edWa").value.trim());
          b.email = document.getElementById("edEmail").value.trim();
          b.website = webRaw ? safeUrl(webRaw) : "";
          b.socials = { facebook: fbRaw ? safeUrl(fbRaw) : "", instagram: igRaw ? safeUrl(igRaw) : "" };
          b.hours = document.getElementById("edHours").value.trim();
          b.complementaryInfo = document.getElementById("edExtra").value.trim();
          toast("Fiche boutique enregistrée (aperçu local).");
          this.back();
        },
        setOrderStatus(id, s) { const o = STATE.orders.find((x) => x.id === id); if (o) { o.status = s; toast("Statut : " + s); } },

        addStaffMember(e, bizId) {
          e.preventDefault();
          STATE.teamMembers.push({
            id: "tm-" + Date.now(), bizId,
            name: document.getElementById("stName").value.trim(),
            email: document.getElementById("stEmail").value.trim(),
            phone: document.getElementById("stPhone").value.trim(),
            role: document.getElementById("stRole").value
          });
          toast("Nouveau membre intégré au staff !");
          render();
        },
        changeRole(id, r) { const m = STATE.teamMembers.find((x) => x.id === id); if (m) { m.role = r; toast("Rôle modifié : " + r); } },
        removeStaff(id) { STATE.teamMembers = STATE.teamMembers.filter((m) => m.id !== id); toast("Membre retiré."); render(); },

        fillComm(dept) {
          const sel = document.getElementById("nbComm"); if (!sel) return;
          sel.innerHTML = (HAITI_GEO[dept] ? Object.keys(HAITI_GEO[dept]) : []).map((c) => `<option>${esc(c)}</option>`).join("");
        },
        createBiz(e) {
          e.preventDefault();
          const name = document.getElementById("nbName").value.trim();
          const webRaw = document.getElementById("nbWeb").value.trim();
          if (webRaw && !safeUrl(webRaw)) {
            toast("Le site web doit commencer par https:// ou http://.");
            return;
          }
          const dept = document.getElementById("nbDept").value;
          const comm = document.getElementById("nbComm").value || (HAITI_GEO[dept] ? Object.keys(HAITI_GEO[dept])[0] : "");
          const id = "biz-" + Date.now();
          STATE.businesses.unshift({
            id, name, initials: name.slice(0, 2).toUpperCase(),
            grad: "linear-gradient(135deg, #0A1A4F, #3B82F6)",
            logoDataUrl: "", coverDataUrl: "",
            subCategory: document.getElementById("nbSub").value.trim(),
            shortDesc: document.getElementById("nbDesc").value.trim(),
            longDesc: document.getElementById("nbDesc").value.trim(),
            categoryId: document.getElementById("nbCat").value,
            dept, commune: comm, city: comm,
            quartier: document.getElementById("nbQuart").value.trim(),
            address: document.getElementById("nbAddr").value.trim(),
            phone: document.getElementById("nbPhone").value.trim(),
            whatsapp: safeDigits(document.getElementById("nbWa").value.trim()),
            email: document.getElementById("nbEmail").value.trim(),
            website: webRaw ? safeUrl(webRaw) : "",
            socials: { facebook: "", instagram: "" },
            hours: document.getElementById("nbHours").value.trim() || "Lun–Sam : 08h00 – 17h00",
            complementaryInfo: "",
            gallery: [],
            status: "pending", rating: 0, reviewCount: 0, followers: 0, views: 0,
            createdAt: "2026-11-12", plan: "Essentiel Gratuit"
          });
          STATE.proBizId = id;
          addAudit(STATE.user ? STATE.user.name : "Entreprise", `Nouvelle fiche soumise : « ${name} »`);
          toast("Fiche soumise (en attente de validation administrative).");
          this.switchRoot("pro-dashboard");
        },
        openMonCash(bizId, planName, amt) {
          const b = getBiz(bizId);
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Parcours MonCash (Aperçu)</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <div class="notice notice-warn" style="margin-bottom:10px;">
              <strong>Aucune transaction réelle :</strong> le paiement MonCash et le changement effectif d'abonnement nécessitent l'API serveur Digicel MonCash, des webhooks vérifiés et Supabase. Ne saisissez aucun PIN ou OTP ici.
            </div>
            <div class="card card-pad form-stack" style="margin-bottom:10px;">
              <div><strong>Offre sélectionnée :</strong> ${esc(planName)}</div>
              <div><strong>Tarif mensuel :</strong> ${money(amt)}</div>
              <div class="small muted">Quota inclus : ${PLAN_QUOTAS[planName] ? PLAN_QUOTAS[planName].maxImages : 2} images / publication pour ${esc(b ? b.name : "")}.</div>
            </div>
            <button type="button" class="btn btn-navy btn-block" onclick="app.closeDrawer()">J'ai compris</button>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },
        admSetStatus(id, s) {
          const b = getBiz(id);
          if (!b) return;
          b.status = s;
          const label = s === "verified" ? "approuvée" : s === "suspended" ? "suspendue" : s;
          addAudit(STATE.user ? STATE.user.name : "Admin Zack", `Entreprise « ${b.name} » ${label}`);
          toast("Statut mis à jour : " + label);
          render();
        },

        /* PARTAGE NATIF + WHATSAPP + COPIE (SÉCURISÉ PAR ID) */
        async shareEntity(type, id) {
          let title = "Zack Haïti", details = "";
          if (type === "biz") {
            const b = getBiz(id);
            if (!b) return;
            title = b.name;
            details = `${getCatName(b.categoryId)} — ${b.commune}, ${b.dept}`;
          } else if (type === "product") {
            const p = STATE.products.find((x) => x.id === id);
            if (!p) return;
            title = p.name;
            details = `${p.priceHtg.toLocaleString("fr-FR")} HTG`;
          } else if (type === "service") {
            const s = STATE.services.find((x) => x.id === id);
            if (!s) return;
            title = s.name;
            details = s.onQuote ? "Prix sur demande" : `${s.priceHtg.toLocaleString("fr-FR")} HTG`;
          } else if (type === "promo") {
            const pr = STATE.promotions.find((x) => x.id === id);
            if (!pr) return;
            title = pr.title;
            details = `${pr.newHtg.toLocaleString("fr-FR")} HTG (jusqu'au ${pr.end})`;
          } else if (type === "event") {
            const ev = STATE.events.find((x) => x.id === id);
            if (!ev) return;
            title = ev.title;
            details = `${ev.date} · ${ev.place}`;
          }
          const shareText = `${title}${details ? " (" + details + ")" : ""} — sur Zack Haïti`;
          STATE.lastShareText = shareText;
          const shareUrl = window.location.href.startsWith("http") ? window.location.href : "https://zack.ht";
          if (navigator.share) {
            try {
              await navigator.share({ title, text: shareText, url: shareUrl });
              return;
            } catch (_) {}
          }
          const waUrl = "https://wa.me/?text=" + encodeURIComponent(shareText + " — " + shareUrl);
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Partager</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <p class="small muted" style="margin-bottom:12px;">${esc(shareText)}</p>
            <div class="form-stack">
              <a class="btn btn-success btn-block" href="${waUrl}" target="_blank" rel="noopener noreferrer">Partager sur WhatsApp</a>
              <button type="button" class="btn btn-navy btn-block" onclick="app.copyShareText()">Copier le texte</button>
            </div>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },
        copyShareText() {
          if (navigator.clipboard && STATE.lastShareText) navigator.clipboard.writeText(STATE.lastShareText).catch(() => {});
          this.closeDrawer();
          toast("Texte copié pour partage !");
        },

        /* INSTALLATION PWA / APK */
        async triggerPwaInstall() {
          if (STATE.deferredPwaPrompt) {
            STATE.deferredPwaPrompt.prompt();
            await STATE.deferredPwaPrompt.userChoice;
            STATE.deferredPwaPrompt = null;
            return;
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "ZACK_TRIGGER_PWA_INSTALL" }, "*");
          }
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Installer Zack (PWA / APK)</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <div class="notice notice-info" style="margin-bottom:10px;">
              <strong>Prérequis technique :</strong> ce fichier HTML autonome doit être hébergé en <strong>HTTPS</strong> avec un fichier <code>manifest.webmanifest</code>, des icônes PNG et un Service Worker (<code>sw.js</code>) pour déclencher l'installation PWA native et générer un APK.
            </div>
            <div class="form-stack small muted">
              <p><strong>Android (Chrome) :</strong> Menu (⋮) → <em>Installer l'application</em> ou <em>Ajouter à l'écran d'accueil</em>.</p>
              <p><strong>iPhone / iPad (Safari) :</strong> Icône <em>Partager</em> → <em>Sur l'écran d'accueil</em>.</p>
              <p><strong>Générer le fichier .apk :</strong> une fois le manifest et le Service Worker en ligne en HTTPS, utilisez <em>PWABuilder</em> ou <em>Bubblewrap</em>.</p>
            </div>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },

        openSpaceDrawer() {
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Zack Haïti</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <div class="form-stack">
              <button type="button" class="btn btn-navy btn-block" onclick="app.closeDrawer(); app.switchRoot('home');">${esc(t("public_space"))}</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.switchRoot('personal-menu');">${esc(t("personal_space"))}</button>
              <button type="button" class="btn btn-primary btn-block" onclick="app.closeDrawer(); app.switchRoot('pro-dashboard');">${esc(t("pro_space"))}</button>
              <button type="button" class="btn btn-yellow btn-block" onclick="app.closeDrawer(); app.switchRoot('admin-menu');">${esc(t("admin_space"))}</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.switchRoot('auth');">Page de connexion</button>
              <div class="grid-2">
                <select class="select" aria-label="Langue" onchange="app.setLang(this.value)"><option value="fr" ${STATE.lang==='fr'?'selected':''}>Français</option><option value="ht" ${STATE.lang==='ht'?'selected':''}>Kreyòl</option></select>
                <select class="select" aria-label="Thème" onchange="app.setTheme(this.value)"><option value="auto" ${STATE.theme==='auto'?'selected':''}>Auto</option><option value="light" ${STATE.theme==='light'?'selected':''}>Clair</option><option value="dark" ${STATE.theme==='dark'?'selected':''}>Sombre</option></select>
              </div>
            </div>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },
        closeDrawer() {
          document.getElementById("drawerOverlay").classList.remove("open");
          if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
            lastFocusedEl.focus();
            lastFocusedEl = null;
          }
        }
      };

      function render() {
        renderHeader();
        renderBottomNav();
        const body = document.getElementById("screenBody");
        const s = STATE.screen;
        let html = "";
        if (s === "auth") html = viewAuth();
        else if (s === "home") html = viewHome();
        else if (s === "explore") html = viewExplore();
        else if (s === "promos") html = viewPromos();
        else if (s === "events") html = viewEvents();
        else if (s === "biz-detail") html = viewBizDetail();
        else if (s === "prod-detail") html = viewProdDetail();
        else if (s === "cart") html = viewCart();
        else if (s === "messages-list") html = viewMessagesList();
        else if (s === "messages-chat") html = viewMessagesChat();
        else if (s === "personal-menu") html = viewPersonalMenu();
        else if (s.startsWith("personal-")) html = viewPersonalSub(s);
        else if (s === "pro-dashboard") html = viewProDashboard();
        else if (s === "pro-publish") html = viewProPublish();
        else if (s.startsWith("pro-")) html = viewProSub(s);
        else if (s === "admin-menu") html = viewAdminMenu();
        else if (s.startsWith("admin-")) html = viewAdminSub(s);
        else html = viewAuth();

        body.innerHTML = html;
        if (s === "messages-chat") body.scrollTop = body.scrollHeight;
        else body.scrollTop = 0;
        if (s === "pro-create") { const d = document.getElementById("nbDept"); if (d) window.app.fillComm(d.value); }
      }

      applyTheme();
      render();
    })();
  </script>
</body>
</html>
