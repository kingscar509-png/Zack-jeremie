<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#123B5D;--t:#0E9F9A;--o:#F4A340;--g:#F5F7FA;--a:#243447}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--g);color:var(--a);line-height:1.5}
a{color:var(--b)}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--b);color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{font-weight:700;color:var(--b);font-size:19px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;flex:1}
nav{display:flex;align-items:center;gap:14px}
nav a{text-decoration:none;font-weight:500;font-size:14px;color:var(--a)}
nav a.cta{background:var(--t);color:#fff;padding:8px 12px;border-radius:10px}
@media(max-width:640px){nav .hide{display:none}}
#ann{background:var(--o);color:#fff;text-align:center;padding:8px;font-size:14px}
.c{max-width:900px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(160deg,var(--b) 0%,#0b2a44 100%);color:#fff;padding:34px 16px 46px;position:relative}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--t),var(--o))}
.hero .in{max-width:900px;margin:0 auto}
.hero h1{margin:0 0 8px;font-size:28px;line-height:1.2;font-weight:700;max-width:560px}
.hero p{margin:0 0 18px;opacity:.9;max-width:520px}
.sb{display:flex;background:#fff;border-radius:12px;padding:5px;max-width:620px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sb input{border:0;margin:0;flex:1;min-width:0;background:transparent;padding:10px;font-size:16px;color:var(--a)}
.sb input:focus{outline:0}
.sb button{border:0;background:var(--t);color:#fff;border-radius:9px;padding:0 18px;font-weight:600;font-family:inherit;font-size:15px;cursor:pointer}
.slg{margin-top:16px;font-weight:600;font-size:14px}
h2{font-size:18px;color:var(--b);margin:22px 0 10px;font-weight:600}
.lk{font-size:13px;color:var(--t);cursor:pointer;font-weight:500;margin-left:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid transparent}
.tile span{display:block;font-size:24px;margin-bottom:4px}
.tile.on{border-color:var(--t);color:var(--b)}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.row>.card{flex:none;width:240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:block;color:inherit;text-decoration:none}
.card b{display:block}.mut{color:#6b7280;font-size:13px}
.bz{display:flex;gap:10px;align-items:center}
.ini{width:44px;height:44px;flex:none;border-radius:12px;background:var(--b);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ini img{width:100%;height:100%;object-fit:cover}
.bd{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;margin-top:4px;background:#e5e7eb}
.bd.ok{background:#d1fae5;color:#065f46}.bd.no{background:#fee2e2;color:#991b1b}.bd.pe{background:#fef3c7;color:#92400e}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;background:var(--b);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;margin:3px 3px 3px 0}
.btn.t{background:var(--t)}.btn.o{background:var(--o)}.btn.l{background:#fff;color:var(--b);border:1px solid var(--b)}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:4px 0 10px;font-family:inherit;background:#fff}
label{font-size:14px;font-weight:600}
.box{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.cover{height:140px;background:linear-gradient(135deg,var(--b),var(--t));background-size:cover;background-position:center}
table{border-collapse:collapse;width:100%;font-size:14px}td{padding:4px 0;border-bottom:1px solid #f3f4f6}
.pimg{width:100%;height:110px;object-fit:cover;border-radius:10px;margin-bottom:6px;background:#e5e7eb}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.why .box{display:flex;gap:12px;align-items:flex-start;margin:0}
.why b{color:var(--b);font-size:15px}
.ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--t);color:#fff;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal .box{max-width:420px;width:100%;margin:0;max-height:90vh;overflow:auto}
footer{text-align:center;color:#6b7280;font-size:13px;padding:22px 14px;background:#fff;margin-top:20px}
footer .sl{font-weight:600;font-size:14px;margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
</style>
</head>
<body>
<header id="hd"></header>
<div id="ann" style="display:none"></div>
<main id="app"><div class="c">Chargement…</div></main>
<footer id="ft"></footer>
<div id="toast"></div>
<div id="modal"></div>
<script>
const SB_URL="https://hwuwqalazmrmdxseawnm.supabase.co";
const SB_KEY="sb_publishable_3pGbQyThjZyO3FpksGtt1g_edpPkzN5";
const TZ="America/Port-au-Prince";
const ADMIN_EMAIL="kingscar509@gmail.com";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let sb=null;
const S={set:{},cats:[],biz:[],hours:{},promos:[],events:[],posts:[],user:null,q:"",cat:"",mode:"in"};

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display="none",4000)}
function modal(h){const m=$("#modal");m.innerHTML='<div class="box">'+h+'</div>';m.style.display="flex"}
function closeModal(){$("#modal").style.display="none"}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

/* ---------- chargement de Supabase (sources de secours) ---------- */
function loadScript(u){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initSb(){
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");if(window.supabase)return window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
  for(const u of ["https://esm.sh/@supabase/supabase-js@2","https://esm.run/@supabase/supabase-js@2"]){
    try{const m=await import(u);return m.createClient(SB_URL,SB_KEY)}catch(e){}
  }
  return null;
}

/* ---------- heures (fuseau Haïti) ---------- */
function nowPAP(){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return{d:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),m:(+g("hour"))*60+(+g("minute"))};
}
const tm=s=>{if(!s)return null;const a=s.split(":");return +a[0]*60+ +a[1]};
function isOpen(id){
  const h=S.hours[id];if(!h||!h.length)return null;
  const n=nowPAP(),f=x=>x&&!x.is_closed&&x.opening_time&&x.closing_time;
  const t=h.find(x=>x.day_of_week===n.d);
  if(f(t)){const o=tm(t.opening_time),c=tm(t.closing_time);if(c>o?(n.m>=o&&n.m<c):n.m>=o)return true}
  const y=h.find(x=>x.day_of_week===(n.d+6)%7);
  if(f(y)){const o=tm(y.opening_time),c=tm(y.closing_time);if(c<=o&&n.m<c)return true}
  return false;
}
const fmt=x=>new Date(x).toLocaleString("fr-FR",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const hh=s=>s?s.slice(0,5):"";

/* ---------- préférences locales ---------- */
function pref(cat){if(!cat)return;try{const p=JSON.parse(localStorage.getItem("zk_pref")||"{}");p[cat]=(p[cat]||0)+1;localStorage.setItem("zk_pref",JSON.stringify(p))}catch(e){}}
function getPref(){try{return JSON.parse(localStorage.getItem("zk_pref")||"{}")}catch(e){return{}}}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

/* ---------- données ---------- */
async function load(){
  const r=await Promise.all([
    sb.from("site_settings").select("key,value"),
    sb.from("categories").select("name,icon").eq("is_active",true).order("display_order"),
    sb.from("businesses").select("*").eq("status","verified").order("created_at",{ascending:false}),
    sb.from("business_hours").select("*"),
    sb.from("promotions").select("*"),
    sb.from("business_events").select("*").order("start_at"),
    sb.from("posts").select("*").order("published_at",{ascending:false}).limit(60)
  ]);
  (r[0].data||[]).forEach(x=>S.set[x.key]=x.value);
  S.cats=r[1].data||[];
  S.biz=r[2].data||[];
  const ids=new Set(S.biz.map(b=>b.id)),now=Date.now();
  S.hours={};(r[3].data||[]).forEach(x=>{if(ids.has(x.business_id))(S.hours[x.business_id]=S.hours[x.business_id]||[]).push(x)});
  S.promos=(r[4].data||[]).filter(p=>ids.has(p.business_id)&&p.is_active&&!p.archived_at&&new Date(p.start_at)<=now&&(!p.end_at||new Date(p.end_at)>now));
  S.events=(r[5].data||[]).filter(e=>ids.has(e.business_id)&&e.is_published&&!e.archived_at&&new Date(e.end_at||e.start_at)>=now);
  S.posts=(r[6].data||[]).filter(p=>ids.has(p.business_id)&&p.is_published&&!p.archived_at&&(!p.expires_at||new Date(p.expires_at)>now));
}
function applyTheme(){
  const t=S.set.theme||{},r=document.documentElement.style;
  [["bleu_profond","--b"],["turquoise","--t"],["orange_dore","--o"],["gris_clair","--g"],["anthracite","--a"]].forEach(k=>{if(t[k[0]])r.setProperty(k[1],t[k[0]])});
  const name=S.set.site_name||"Zack",lg=S.set.logo||{};
  document.title=name+" – "+(S.set.tagline||"");
  $("#hd").innerHTML='<div class="logo">'+(lg.type==="image"&&lg.url?'<img src="'+esc(lg.url)+'" alt="">':esc(lg.text||"Z"))+'</div><a class="brand" href="#">'+esc(name)+'</a><nav><a class="hide" href="#entreprises">Entreprises</a><a class="hide" href="#categories">Catégories</a><a href="#/pro">'+(S.user?"Mon espace":"Connexion")+'</a><a class="cta hide" href="#/pro">Inscrire mon entreprise</a></nav>';
  const a=S.set.announcement||{};
  $("#ann").style.display=a.enabled&&a.text?"block":"none";$("#ann").textContent=a.text||"";
  const c=S.set.contact||{},p=[];
  if(c.phone)p.push(esc(c.phone));if(c.email)p.push(esc(c.email));if(c.address)p.push(esc(c.address));
  $("#ft").innerHTML='<div class="sl">'+slogan(false)+'</div>'+esc(S.set.subtitle||"")+"<br>"+(p.length?p.join(" · ")+"<br>":"")+"© "+esc(name);
}

/* ---------- cartes ---------- */
const initial=b=>b.logo_url?'<img src="'+esc(b.logo_url)+'" alt="">':esc((b.name||"?")[0].toUpperCase());
const place=b=>[b.street,b.city].filter(Boolean).join(", ")||b.address||b.neighborhood||"";
function openBadge(id){const o=isOpen(id);return o===true?'<span class="bd ok">Ouvert maintenant</span>':o===false?'<span class="bd no">Fermé</span>':""}
function card(b){
  return '<a class="card" href="#e/'+esc(b.slug)+'"><div class="bz"><div class="ini">'+initial(b)+'</div><div><b>'+esc(b.name)+'</b><span class="mut">'+esc(b.category||"")+'</span></div></div><div class="mut" style="margin-top:6px">'+esc(place(b))+'</div>'+openBadge(b.id)+'</a>';
}
const bn=id=>{const b=S.biz.find(x=>x.id===id);return b?b:null};
function promoCard(p){
  const b=bn(p.business_id);if(!b)return"";
  const d=p.discount_type==="percentage"&&p.discount_value!=null?"-"+p.discount_value+" %":p.discount_type==="fixed"&&p.discount_value!=null?"-"+p.discount_value+" HTG":"Offre spéciale";
  return '<a class="card" href="#e/'+esc(b.slug)+'"><span class="bd pe">'+esc(d)+'</span><b>'+esc(p.title)+'</b><span class="mut">'+esc(b.name)+'</span>'+(p.end_at?'<div class="mut">Jusqu’au '+fmt(p.end_at)+'</div>':"")+'</a>';
}
function eventCard(e){
  const b=bn(e.business_id);if(!b)return"";
  return '<a class="card" href="#e/'+esc(b.slug)+'"><b>'+esc(e.title)+'</b><span class="mut">'+fmt(e.start_at)+(e.location?" · "+esc(e.location):"")+'</span><div class="mut">'+esc(b.name)+'</div></a>';
}
const sec=(t,items,cls)=>items.length?'<h2>'+t+'</h2><div class="'+(cls||"row")+'">'+items.join("")+'</div>':"";

/* ---------- accueil ---------- */
function filt(){
  const q=norm(S.q).trim();
  return S.biz.filter(b=>(!S.cat||b.category===S.cat)&&(!q||norm([b.name,b.category,b.street,b.city,b.neighborhood,b.address].join(" ")).includes(q)));
}
function pourToi(){
  const day=30*864e5,pf=getPref();
  let nouv=S.biz.filter(b=>Date.now()-new Date(b.created_at)<day).slice(0,6);
  if(!nouv.length)nouv=S.biz.slice(0,4);
  const ouvert=shuffle(S.biz.filter(b=>isOpen(b.id)===true)).slice(0,6);
  const sel=S.biz.map(b=>[(pf[b.category]||0)*2+Math.random(),b]).sort((x,y)=>y[0]-x[0]).slice(0,4).map(x=>x[1]);
  return sec("Nouveautés",nouv.map(card))+
    sec("Promotions en cours",S.promos.slice(0,8).map(promoCard))+
    sec("Événements à venir",S.events.slice(0,8).map(eventCard))+
    sec("Ouvert maintenant",ouvert.map(card))+
    sec(Object.keys(pf).length?"Sélection pour toi":"Sélection du moment",sel.map(card));
}
function slogan(d){
  const cols=d?["#fff","#2dd4bf","var(--o)"]:["var(--b)","var(--t)","var(--o)"];
  return (S.set.tagline||"").split(/\s+/).filter(Boolean).map((w,i)=>'<span style="color:'+cols[i%3]+'">'+esc(w)+'</span>').join(" ");
}
const IC={store:"M3 9l1-5h16l1 5M3 9v11h18V9M3 9c0 2 4 2 4 0 0 2 5 2 5 0 0 2 5 2 5 0 0 2 4 2 4 0M9 20v-6h6v6",phone:"M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z",growth:"M3 17l6-6 4 4 8-8M15 7h6v6",share:"M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4"};
const ico=n=>'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[n]+'"/></svg>';
const WHY=[["store","Annuaire des entreprises","Trouvez facilement les entreprises près de vous."],["phone","Connexion directe","Contactez en un clic par téléphone, WhatsApp ou email."],["growth","Visibilité et croissance","Développez votre activité et atteignez plus de clients."],["share","Opportunités locales","Découvrez des services, des produits et des partenaires."]];
function home(){
  document.title=(S.set.site_name||"Zack")+" – "+(S.set.tagline||"");
  const h=S.set.hero||{},hs=S.set.home_sections||{};
  let x='<div class="hero"><div class="in"><h1>'+esc(h.title||S.set.site_name||"Zack")+'</h1><p>'+esc(h.text||"")+'</p><div class="sb"><input id="q" placeholder="Nom, catégorie, rue ou ville…" value="'+esc(S.q)+'" oninput="S.q=this.value;renderRes()" onkeydown="if(event.key===\'Enter\')goRes()"><button onclick="goRes()">Rechercher</button></div><div class="slg">'+slogan(true)+'</div></div></div><div class="c">';
  if(hs.categories!==false)x+='<h2 id="categories" style="margin-top:6px">Catégories populaires</h2><div class="tiles" id="tiles"></div>';
  if(hs.cta!==false)x+='<div class="box" style="margin-top:16px"><b>Vous avez une entreprise à Jérémie ?</b><div class="mut">Créez sa carte d’identité numérique.</div><a class="btn o" href="#/pro">Inscrire mon entreprise</a></div>';
  x+='<div id="pt"></div>';
  if(hs.liste!==false)x+='<h2 id="entreprises"><span id="rt"></span></h2><div class="grid" id="res"></div>';
  x+='<h2>Pourquoi Zack ?</h2><div class="why">'+WHY.map(w=>'<div class="box"><div class="ic">'+ico(w[0])+'</div><div><b>'+w[1]+'</b><div class="mut">'+w[2]+'</div></div></div>').join("")+'</div></div>';
  $("#app").innerHTML=x;renderTiles();renderRes();
}
function renderTiles(){
  const el=$("#tiles");if(!el)return;
  el.innerHTML=S.cats.map((c,i)=>'<div class="tile'+(S.cat===c.name?" on":"")+'" onclick="setCat('+i+')"><span>'+esc(c.icon||"🏪")+'</span>'+esc(c.name)+'</div>').join("");
}
function setCat(i){
  const n=S.cats[i].name;S.cat=S.cat===n?"":n;renderTiles();renderRes();
  if(S.cat)goRes();
}
function goRes(){const el=document.getElementById("entreprises");if(el)el.scrollIntoView({behavior:"smooth"})}
function clearF(){S.q="";S.cat="";const q=$("#q");if(q)q.value="";renderTiles();renderRes()}
function renderRes(){
  const r=filt(),searching=S.q.trim()||S.cat,hs=S.set.home_sections||{};
  const pt=$("#pt");if(pt)pt.innerHTML=(!searching&&hs.pour_toi!==false)?'<h2>Pour toi</h2>'+pourToi():"";
  const rt=$("#rt");if(rt)rt.innerHTML=searching?r.length+" résultat"+(r.length>1?"s":"")+' <span class="lk" onclick="clearF()">Tout afficher</span>':"Toutes les entreprises";
  const el=$("#res");if(el)el.innerHTML=r.length?r.map(card).join(""):'<div class="mut">Aucune entreprise trouvée.</div>';
}

/* ---------- fiche entreprise ---------- */
const digits=s=>String(s||"").replace(/\D/g,"");
function waLink(s){let d=digits(s);if(d.length===8)d="509"+d;return"https://wa.me/"+d}
const shareUrl=b=>location.origin+location.pathname+"#e/"+b.slug;
async function fiche(slug){
  const b=S.biz.find(x=>x.slug===slug);
  if(!b){$("#app").innerHTML='<div class="c"><div class="box">Entreprise introuvable, ou pas encore validée.</div><a class="btn" href="#">Retour à l’accueil</a></div>';return}
  pref(b.category);document.title=b.name+" – "+(S.set.site_name||"Zack");
  $("#app").innerHTML='<div class="cover"'+(b.cover_url?' style="background-image:url(\''+esc(b.cover_url)+'\')"':"")+'></div><div class="c" id="fc"><div class="box">Chargement…</div></div>';
  const r=await Promise.all([
    sb.from("products").select("*").eq("business_id",b.id).eq("is_available",true),
    sb.from("product_images").select("*").eq("business_id",b.id).order("display_order"),
    sb.from("services").select("*").eq("business_id",b.id).eq("is_available",true),
    sb.from("business_media").select("*").eq("business_id",b.id).order("display_order"),
    sb.from("reviews").select("rating,title,content,created_at,owner_response").eq("business_id",b.id).eq("status","approved").order("created_at",{ascending:false})
  ]);
  if(location.hash!=="#e/"+slug)return;
  const imgs={},al={};ZI=[];GAL=(r[3].data||[]).filter(m=>m.media_type==="image").map(m=>m.media_url);(r[1].data||[]).slice().sort((x,y)=>(y.is_primary?1:0)-(x.is_primary?1:0)).forEach(i=>{if(!imgs[i.product_id])imgs[i.product_id]=i.image_url;(al[i.product_id]=al[i.product_id]||[]).push(i.image_url)});

function hoursForm(id,H){

  }).join("")+'</table>';

async function saveHours(id){
  const g=x=>document.getElementById(x),rows=[];
  for(const d of [0,1,2,3,4,5,6]){
    const k=id+"_"+d,cl=g("hc_"+k).checked,o=g("ho_"+k).value,f=g("hf_"+k).value;
    if(!cl&&(!o||!f)){toast("Indique l’ouverture et la fermeture pour "+DJ[d]+", ou coche Fermé.");return}
    rows.push({business_id:id,day_of_week:d,is_closed:cl,opening_time:o||null,closing_time:f||null});
  }
  const ex=await sb.from("business_hours").select("id,day_of_week").eq("business_id",id);
  if(ex.error){toast("Erreur : "+ex.error.message);return}
  let err=null;
  for(const r of rows){
    const e=(ex.data||[]).find(y=>y.day_of_week===r.day_of_week);
    const q=e?await sb.from("business_hours").update(r).eq("id",e.id):await sb.from("business_hours").insert(r);
    if(q.error){err=q.error;break}
  }
  if(err){toast("Erreur : "+err.message);return}
  toast("Horaires enregistrés.");load();
}

function compress(f,max,q){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error("Compression impossible")),"image/jpeg",q)};im.onerror=()=>ko(new Error("Image illisible"));im.src=u})}
async function up(bid,sub,f){
  const b=await compress(f,1280,.78),p=bid+"/"+sub+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,6)+".jpg";
  const r=await sb.storage.from("zack-public-media").upload(p,b,{contentType:"image/jpeg"});
  if(r.error)throw r.error;
  return{path:p,url:sb.storage.from("zack-public-media").getPublicUrl(p).data.publicUrl};
}

  const r=await sb.from("posts").select("*").eq("business_id",bid).is("archived_at",null).order("created_at",{ascending:false});
  if(r.error)return fail(r);
  $("#mb").innerHTML=`<div class="box"><b>Nouvelle publication</b><label>Type</label><select id="pt_t"><option value="news">Actualité</option><option value="announcement">Annonce</option></select><label>Titre</label><input id="pt_ti"><label>Texte</label><textarea id="pt_c" rows="3"></textarea>${ex("pt")}<button class="btn" onclick="addPost('${bid}')">Publier</button></div>`+(r.data.map(x=>`<div class="box"><b>${esc(x.title||"(sans titre)")}</b> <span class="mut">${x.post_type==="announcement"?"Annonce":"Actualité"}${x.expires_at?" · expire le "+fmt(x.expires_at)+" ("+(x.expire_action==="delete"?"suppression":"archivage")+")":""}</span><div>${esc(x.content)}</div>${rowBtns("posts",x.id)}</div>`).join("")||'<div class="mut">Aucune publication.</div>');
}
function addPost(bid){run(async()=>{
  const c=$("#pt_c").value.trim(),e=dtv($("#pt_e").value);
  if(!c){toast("Écris le texte de la publication.");return}
  if(e&&new Date(e)<=new Date()){toast("La date d’expiration doit être dans le futur.");return}
  const r=await sb.from("posts").insert({business_id:bid,post_type:$("#pt_t").value,title:$("#pt_ti").value.trim()||null,content:c,is_published:true,published_at:nowIso(),expires_at:e,expire_action:$("#pt_a").value});
  if(r.error)throw r.error;toast("Publié.");refresh();
})}
async function mPromo(bid){
  const r=await sb.from("promotions").select("*").eq("business_id",bid).is("archived_at",null).order("created_at",{ascending:false});
  if(r.error)return fail(r);
  $("#mb").innerHTML=`<div class="box"><b>Nouvelle promotion</b><label>Titre</label><input id="pm_ti"><label>Description</label><textarea id="pm_d" rows="2"></textarea><label>Type de réduction</label><select id="pm_t"><option value="percentage">Pourcentage (%)</option><option value="fixed">Montant fixe</option><option value="special">Offre spéciale</option></select><label>Valeur (sauf offre spéciale)</label><input id="pm_v" type="number" min="0" step="any" inputmode="decimal">${ex("pm")}<button class="btn" onclick="addPromo('${bid}')">Publier</button></div>`+(r.data.map(x=>`<div class="box"><b>${esc(x.title)}</b> <span class="mut">${x.discount_type==="percentage"?"-"+x.discount_value+" %":x.discount_type==="fixed"?"-"+x.discount_value:"Offre spéciale"}${x.end_at?" · jusqu’au "+fmt(x.end_at)+" ("+(x.expire_action==="delete"?"suppression":"archivage")+")":""}</span>${x.description?`<div>${esc(x.description)}</div>`:""}${rowBtns("promotions",x.id)}</div>`).join("")||'<div class="mut">Aucune promotion.</div>');
}
function addPromo(bid){run(async()=>{
  const t=$("#pm_ti").value.trim(),ty=$("#pm_t").value,v=$("#pm_v").value,e=dtv($("#pm_e").value);
  if(!t){toast("Le titre est obligatoire.");return}
  if(ty!=="special"&&v===""){toast("Indique la valeur de la réduction.");return}
  if(ty==="percentage"&&Number(v)>100){toast("Un pourcentage ne dépasse pas 100.");return}
  if(e&&new Date(e)<=new Date()){toast("La date de fin doit être dans le futur.");return}
  const r=await sb.from("promotions").insert({business_id:bid,title:t,description:$("#pm_d").value.trim()||null,discount_type:ty,discount_value:ty==="special"||v===""?null:Number(v),start_at:nowIso(),end_at:e,is_active:true,expire_action:$("#pm_a").value});
  if(r.error)throw r.error;toast("Promotion publiée.");refresh();
})}
async function mEv(bid){
  const r=await sb.from("business_events").select("*").eq("business_id",bid).is("archived_at",null).order("start_at",{ascending:false});
  if(r.error)return fail(r);
  $("#mb").innerHTML=`<div class="box"><b>Nouvel événement</b><label>Titre</label><input id="ev_ti"><label>Description</label><textarea id="ev_d" rows="2"></textarea><label>Lieu</label><input id="ev_l"><label>Début</label><input id="ev_s" type="datetime-local"><label>Fin (facultatif)</label><input id="ev_f" type="datetime-local"><button class="btn" onclick="addEv('${bid}')">Publier</button></div>`+(r.data.map(x=>`<div class="box"><b>${esc(x.title)}</b> <span class="mut">${fmt(x.start_at)}${x.location?" · "+esc(x.location):""}</span>${x.is_published?"":' <span class="bd no">Non publié</span>'}${rowBtns("business_events",x.id)}</div>`).join("")||'<div class="mut">Aucun événement.</div>');
}
function addEv(bid){run(async()=>{
  const t=$("#ev_ti").value.trim(),s=dtv($("#ev_s").value),f=dtv($("#ev_f").value);
  if(t.length<2||!s){toast("Titre et date de début obligatoires.");return}
  if(f&&new Date(f)<=new Date(s)){toast("La fin doit être après le début.");return}
  const r=await sb.from("business_events").insert({business_id:bid,title:t,description:$("#ev_d").value.trim()||null,location:$("#ev_l").value.trim()||null,start_at:s,end_at:f,is_published:true});
  if(r.error)throw r.error;toast("Événement publié.");refresh();
})}
function arch(t,id){run(async()=>{const r=await sb.from(t).update({archived_at:nowIso()}).eq("id",id);if(r.error)throw r.error;toast("Archivé.");refresh()})}
function delRow(t,id){run(async()=>{if(!confirm("Supprimer définitivement ?"))return;const r=await sb.from(t).delete().eq("id",id);if(r.error)throw r.error;refresh()})}
function unarch(t,id){
  if(t==="business_events"){modal(`<b>Republier l’événement</b><label>Nouvelle date de début</label><input id="rp_s" type="datetime-local"><button class="btn" onclick="repubEv('${id}')">Republier</button><button class="btn l" onclick="closeModal()">Annuler</button>`);return}
  run(async()=>{
    const u=t==="posts"?{archived_at:null,is_published:true,expires_at:null,published_at:nowIso()}:{archived_at:null,is_active:true,start_at:nowIso(),end_at:null};
    const r=await sb.from(t).update(u).eq("id",id);if(r.error)throw r.error;toast("Republié.");refresh();
  });
}
function repubEv(id){run(async()=>{
  const s=dtv($("#rp_s").value);if(!s||new Date(s)<=new Date()){toast("Choisis une date de début dans le futur.");return}
  const r=await sb.from("business_events").update({archived_at:null,is_published:true,start_at:s,end_at:null}).eq("id",id);if(r.error)throw r.error;
  closeModal();toast("Événement republié.");refresh();
})}
async function mArch(bid){
  const q=t=>sb.from(t).select("*").eq("business_id",bid).not("archived_at","is",null).order("archived_at",{ascending:false});
  const r=await Promise.all([q("posts"),q("promotions"),q("business_events")]);
  const err=r.find(x=>x.error);if(err)return fail(err);
  const blk=(h,t,l,f)=>l.length?`<h2>${h}</h2>`+l.map(x=>`<div class="box"><b>${esc(f(x))}</b> <span class="mut">archivé le ${fmt(x.archived_at)}</span>${rowBtns(t,x.id,true)}</div>`).join(""):"";
  $("#mb").innerHTML=(blk("Publications","posts",r[0].data,x=>x.title||x.content.slice(0,50))+blk("Promotions","promotions",r[1].data,x=>x.title)+blk("Événements","business_events",r[2].data,x=>x.title))||'<div class="mut">Aucune archive.</div>';
}
const RS={pending:["pe","En attente"],approved:["ok","Publié"],rejected:["no","Refusé"]};
async function mAvis(bid){
  const r=await sb.from("reviews").select("*").eq("business_id",bid).order("created_at",{ascending:false});
  if(r.error)return fail(r);
  $("#mb").innerHTML=r.data.map(x=>{const st=RS[x.status]||["",x.status];return `<div class="box"><span style="color:var(--o)">${"★".repeat(x.rating)}${"☆".repeat(5-x.rating)}</span> <span class="bd ${st[0]}">${st[1]}</span>${x.title?`<b>${esc(x.title)}</b>`:""}<div>${esc(x.content)}</div><div class="mut">${fmt(x.created_at)}</div><label>Votre réponse</label><textarea id="rs_${x.id}" rows="2">${esc(x.owner_response||"")}</textarea><button class="btn t" onclick="respond('${x.id}')">Répondre</button></div>`}).join("")||'<div class="mut">Aucun avis.</div>';
}
function respond(id){run(async()=>{
  const t=$("#rs_"+id).value.trim();if(t.length<2){toast("Écris une réponse.");return}
  const r=await sb.from("reviews").update({owner_response:t,owner_responded_at:nowIso()}).eq("id",id).select("id");
  if(r.error)throw r.error;if(!r.data.length){toast("Réponse non enregistrée : droits insuffisants.");return}
  toast("Réponse enregistrée.");
})}
function revHtml(b,R){
  const avg=R.length?(R.reduce((a,x)=>a+x.rating,0)/R.length).toFixed(1):null,st=n=>"★".repeat(n)+"☆".repeat(5-n);
  return '<h2>Avis'+(avg?" · "+avg+" / 5 ("+R.length+")":"")+'</h2>'+(R.map(x=>`<div class="card" style="margin-bottom:8px"><span style="color:var(--o)">${st(x.rating)}</span>${x.title?` <b style="display:inline">${esc(x.title)}</b>`:""}<div>${esc(x.content)}</div><div class="mut">${fmt(x.created_at)}</div>${x.owner_response?`<div class="mut" style="margin-top:6px;border-left:3px solid var(--t);padding-left:8px"><b style="display:inline">Réponse de l’entreprise :</b> ${esc(x.owner_response)}</div>`:""}</div>`).join("")||'<div class="mut">Aucun avis pour le moment.</div>')+
  (S.user?`<div class="box" style="margin-top:10px"><b>Donner mon avis</b><label>Note</label><select id="rv_r"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><label>Commentaire (10 caractères minimum)</label><textarea id="rv_c" rows="3" maxlength="2000"></textarea><button class="btn" onclick="sendReview('${b.id}')">Envoyer</button></div>`:'<div class="mut">Connecte-toi pour laisser un avis.</div>');
}
function sendReview(bid){run(async()=>{
  const c=$("#rv_c").value.trim();if(c.length<10){toast("Le commentaire doit faire au moins 10 caractères.");return}
  const r=await sb.from("reviews").insert({business_id:bid,user_id:S.user.id,rating:Number($("#rv_r").value),content:c,status:"pending"});
  if(r.error)throw r.error;$("#rv_c").value="";toast("Merci ! Ton avis sera visible après validation.");
})}

/* ---------- navigation ---------- */
function route(){
  if(!sb)return;
  const h=location.hash.slice(1);window.scrollTo(0,0);
  if(h.indexOf("e/")===0)fiche(decodeURIComponent(h.slice(2)));
  else if(h==="/pro")account();
  else if(h==="/admin")admin();
  else{home();if(h==="categories"||h==="entreprises"){const el=document.getElementById(h);if(el)el.scrollIntoView()}}
}
window.addEventListener("hashchange",route);

(async function(){
  sb=await initSb();
  if(!sb){$("#app").innerHTML='<div class="c"><div class="box">Impossible de charger le service. Vérifie ta connexion et recharge la page.</div></div>';return}
  try{await load()}catch(e){toast("Erreur de chargement : "+e.message)}
  const s=await sb.auth.getSession();S.user=s.data&&s.data.session?s.data.session.user:null;
  applyTheme();route();
  sb.auth.onAuthStateChange((ev,sess)=>{
    const was=S.user&&S.user.id;S.user=sess?sess.user:null;S.ap=null;
    setTimeout(async()=>{
      if(S.user&&(S.user.email||"").toLowerCase()===ADMIN_EMAIL&&ev==="SIGNED_IN"){try{await sb.rpc("claim_main_admin")}catch(e){}}
      applyTheme();
      if(ev==="PASSWORD_RECOVERY"){recoveryView();return}if(location.hash==="#/pro")account();else if(location.hash==="#/admin")admin();
    },0);
  });
})();
</script>
</body>
</html>
