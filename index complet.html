<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1A4F" />
  <meta name="application-name" content="Zack Haïti" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zack Haïti" />
  <!-- Préparation PWA : l'installation réelle sur mobile requiert un fichier manifest.webmanifest et un Service Worker (sw.js) servis en HTTPS lors du déploiement. -->
  <title>Zack Haïti — Annuaire & plateforme numérique nationale des entreprises</title>
  <meta name="description" content="Zack connecte les entreprises, commerces, artisans et services des 10 départements d'Haïti avec les consommateurs : recherche locale, fiches détaillées, produits, promotions et événements." />
  <meta property="og:title" content="Zack Haïti — Plateforme numérique nationale des entreprises" />
  <meta property="og:description" content="Découvrez les entreprises, produits et services partout en Haïti (10 départements, communes et quartiers)." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_HT" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A1A4F;
      --navy-hover: #102770;
      --blue: #3B82F6;
      --blue-soft: rgba(59, 130, 246, 0.11);
      --yellow: #FFC107;
      --yellow-hover: #F5B400;
      --yellow-text: #0A1A4F;

      --outer-bg: #E9EEF7;
      --bg: #F6F8FC;
      --surface: #FFFFFF;
      --surface-alt: #F1F5F9;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text: #0F172A;
      --text-muted: #475569;
      --text-subtle: #64748B;

      --success: #15803D;
      --success-bg: rgba(21, 128, 61, 0.12);
      --warning: #B45309;
      --warning-bg: rgba(180, 83, 9, 0.12);
      --danger: #B91C1C;
      --danger-bg: rgba(185, 28, 28, 0.12);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 3px rgba(10, 26, 79, 0.06);
      --shadow-shell: 0 20px 50px rgba(10, 26, 79, 0.18);
    }

    html.dark {
      --outer-bg: #030712;
      --bg: #070C1B;
      --surface: #0F172A;
      --surface-alt: #162036;
      --border: #1E293B;
      --border-strong: #334155;
      --text: #F8FAFC;
      --text-muted: #CBD5E1;
      --text-subtle: #94A3B8;
      --blue-soft: rgba(59, 130, 246, 0.18);
      --success: #4ADE80;
      --success-bg: rgba(74, 222, 128, 0.14);
      --warning: #FBBF24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --danger: #F87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-shell: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--outer-bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Desktop outer bar */
    .desktop-toolbar { display: none; }
    @media (min-width: 640px) {
      .desktop-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        max-width: 1240px;
        margin: 10px auto 0;
        padding: 8px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        font-size: 0.78rem;
      }
      body { padding: 0 14px 16px; }
    }

    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .seg-control {
      display: inline-flex;
      background: var(--surface-alt);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }
    .seg-btn {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .seg-btn.active { background: var(--navy); color: #FFFFFF; font-weight: 600; }
    html.dark .seg-btn.active { background: var(--blue); }

    /* App Shell: native page scroll on phone, bounded 9:16 / desktop frame on >= 640px */
    .app-shell {
      width: 100%;
      max-width: 100%;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 640px) {
      .app-shell.mode-916 {
        width: 100%;
        max-width: 412px;
        height: min(760px, calc(100vh - 88px));
        min-height: 620px;
        margin: 12px auto 0;
        border-radius: 28px;
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-shell);
        overflow: hidden;
      }
      .app-shell.mode-desktop {
        max-width: 1240px;
        height: calc(100vh - 88px);
        margin: 12px auto 0;
        border-radius: 18px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-shell);
        overflow: hidden;
      }
    }

    /* Header */
    .app-header {
      flex-shrink: 0;
      height: 54px;
      padding: 0 12px;
      background: var(--navy);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-title { font-size: 0.96rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--yellow); color: var(--navy);
      display: grid; place-items: center; font-weight: 700; font-size: 1rem; flex-shrink: 0;
    }
    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.11); color: #FFFFFF;
      position: relative; flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .lang-pill-btn {
      height: 30px; padding: 0 8px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.14); color: #FFFFFF;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
    }
    .badge-dot {
      position: absolute; top: 2px; right: 2px;
      min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px;
      background: var(--yellow); color: var(--navy);
      font-size: 0.62rem; font-weight: 700; display: grid; place-items: center;
    }

    /* Body */
    .screen-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 15px 15px 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 640px) {
      .screen-body {
        flex: 1 1 0%;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
    }
    .app-shell.mode-desktop .screen-body { padding: 24px 24px 100px; }
    .screen-body > * { min-width: 0; flex-shrink: 0; }

    /* Floating Detached Bottom Dock */
    .bottom-nav {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 392px;
      height: 60px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(10, 26, 79, 0.22);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0 4px;
      z-index: 45;
    }
    @media (min-width: 640px) {
      .bottom-nav {
        position: absolute;
        bottom: 12px;
      }
      .app-shell.mode-desktop .bottom-nav {
        max-width: 500px;
      }
    }
    html.dark .bottom-nav {
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }
    .bottom-nav.hidden { display: none; }
    .bnav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 0.68rem; font-weight: 500; color: var(--text-subtle); min-width: 0; min-height: 44px;
    }
    .bnav-btn.active { color: var(--blue); font-weight: 600; }
    .bnav-fab {
      width: 40px; height: 40px; border-radius: 13px;
      background: var(--yellow); color: var(--navy); display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.45);
    }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      min-width: 0;
    }
    .card-pad { padding: 15px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .section-title { font-size: 0.98rem; font-weight: 700; }
    .link-more { font-size: 0.78rem; font-weight: 600; color: var(--blue); white-space: nowrap; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .grid-prods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .app-shell.mode-desktop .grid-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .app-shell.mode-desktop .grid-prods { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .app-shell.mode-desktop .cat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .app-shell.mode-desktop .narrow-wrap { width: 100%; max-width: 520px; margin: 0 auto; }
    .app-shell.mode-desktop .detail-two-col { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 16px; align-items: start; }

    .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .story-biz { width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
    .story-avatar {
      width: 58px; height: 58px; border-radius: 16px;
      display: grid; place-items: center; color: #FFFFFF; font-weight: 700; font-size: 1rem;
      border: 2px solid var(--surface); box-shadow: var(--shadow-sm);
      overflow: hidden; background-size: cover; background-position: center;
    }
    .story-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .story-name { font-size: 0.72rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 40px; padding: 8px 13px; border-radius: var(--radius-sm);
      font-size: 0.84rem; font-weight: 600; white-space: nowrap;
      transition: transform 120ms ease, background 150ms ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 33px; padding: 5px 10px; font-size: 0.76rem; }
    .btn-block { width: 100%; }
    .btn-navy { background: var(--navy); color: #FFFFFF; }
    .btn-primary { background: var(--blue); color: #FFFFFF; }
    .btn-yellow { background: var(--yellow); color: var(--yellow-text); }
    .btn-outline { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); }
    .btn-danger { background: var(--danger); color: #FFFFFF; }
    .btn-success { background: var(--success); color: #FFFFFF; }

    /* Forms */
    .form-stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field label { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); }
    .input, .select, .textarea {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 9px 11px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 0.85rem;
    }
    .textarea { min-height: 78px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .home-search {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 5px 10px; min-height: 44px; width: 100%;
    }
    .home-search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 0.86rem; }

    .hero-banner {
      background: linear-gradient(130deg, var(--navy) 0%, #173694 65%, #2563EB 100%);
      color: #FFFFFF; border-radius: var(--radius-lg); padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .hero-banner h1 { font-size: 1.2rem; line-height: 1.28; font-weight: 700; }
    .hero-banner p { font-size: 0.8rem; color: rgba(255, 255, 255, 0.86); }

    .tabs-bar {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
      border-bottom: 1px solid var(--border); scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      padding: 8px 11px; font-size: 0.8rem; font-weight: 600;
      color: var(--text-subtle); border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0;
    }
    .tab-item.active { color: var(--blue); border-bottom-color: var(--blue); }

    .menu-list { display: flex; flex-direction: column; }
    .menu-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 13px 15px; min-height: 48px; border-bottom: 1px solid var(--border);
      text-align: left; width: 100%; background: var(--surface);
    }
    .menu-row:last-child { border-bottom: none; }
    .menu-row:hover { background: var(--surface-alt); }
    .menu-row-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }

    /* Media & Image Upload Galleries */
    .media-box {
      width: 100%; height: 110px; background: var(--surface-alt);
      display: grid; place-items: center; overflow: hidden; position: relative;
    }
    .media-box img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-strip { display: flex; gap: 8px; flex-wrap: wrap; }
    .thumb-item {
      width: 68px; height: 68px; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border-strong); position: relative; background: var(--surface-alt);
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-del {
      position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
      border-radius: 999px; background: rgba(10, 26, 79, 0.85); color: #fff;
      font-size: 0.7rem; font-weight: 700; display: grid; place-items: center;
    }
    .upload-zone {
      border: 1.5px dashed var(--border-strong); border-radius: 10px;
      padding: 12px; text-align: center; background: var(--surface-alt);
      cursor: pointer; display: block; font-size: 0.8rem;
    }
    .upload-zone input { display: none; }

    /* Cover banners for profiles */
    .cover-area {
      height: 122px; width: 100%; position: relative; padding: 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
      background-size: cover; background-position: center; overflow: hidden;
    }
    .cover-area img.cover-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
    }
    .cover-area > *:not(.cover-img) { position: relative; z-index: 1; }

    .meta { font-size: 0.74rem; color: var(--text-subtle); display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .small { font-size: 0.78rem; }
    .muted { color: var(--text-subtle); }
    .price-htg { font-weight: 700; color: var(--navy); font-size: 0.94rem; }
    html.dark .price-htg { color: var(--yellow); }
    .status-ok { color: var(--success); font-weight: 600; font-size: 0.76rem; }
    .status-warn { color: var(--warning); font-weight: 600; font-size: 0.76rem; }
    .status-bad { color: var(--danger); font-weight: 600; font-size: 0.76rem; }

    .notice {
      padding: 11px 13px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface-alt);
      font-size: 0.78rem; color: var(--text-muted);
    }
    .notice-warn { border-color: rgba(180, 83, 9, 0.35); background: var(--warning-bg); color: var(--text); }
    .notice-info { border-color: rgba(59, 130, 246, 0.35); background: var(--blue-soft); color: var(--text); }

    .chat-feed { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .bubble { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 0.83rem; line-height: 1.45; }
    .bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
    .bubble.me { align-self: flex-end; background: var(--navy); color: #FFFFFF; }
    html.dark .bubble.me { background: var(--blue); }
    .bubble-time { font-size: 0.68rem; opacity: 0.72; margin-top: 4px; text-align: right; }

    .drawer-overlay {
      position: fixed; inset: 0; z-index: 60; background: rgba(7, 12, 27, 0.6);
      display: none; align-items: flex-end; justify-content: center; padding: 12px;
    }
    .drawer-overlay.open { display: flex; }
    @media (min-width: 640px) { .drawer-overlay { align-items: center; } }
    .drawer-sheet {
      width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px; box-shadow: var(--shadow-shell);
    }

    .toast-box {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
      z-index: 80; width: calc(100% - 32px); max-width: 350px;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .toast {
      background: var(--navy); color: #FFFFFF; padding: 10px 14px;
      border-radius: 10px; font-size: 0.8rem; font-weight: 500; text-align: center;
      box-shadow: var(--shadow-shell);
    }

    .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .divider { height: 1px; background: var(--border); margin: 10px 0; }

    /* Badges vérifiés, catégories, filtres, états */
    .verified-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 6px;
      background: var(--blue-soft); color: var(--blue);
      font-size: 0.7rem; font-weight: 700; white-space: nowrap;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px;
      font-size: 0.72rem; font-weight: 600; white-space: nowrap;
    }
    .status-pill.ok { background: var(--success-bg); color: var(--success); }
    .status-pill.warn { background: var(--warning-bg); color: var(--warning); }
    .status-pill.bad { background: var(--danger-bg); color: var(--danger); }

    .cat-tile {
      display: flex; align-items: center; gap: 9px; text-align: left;
      padding: 10px 11px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      min-height: 48px; transition: border-color 150ms ease, background 150ms ease;
    }
    .cat-tile:hover, .cat-tile.active { border-color: var(--blue); background: var(--blue-soft); }
    .cat-ico {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: grid; place-items: center; background: var(--surface-alt); color: var(--navy);
    }
    html.dark .cat-ico { color: var(--yellow); }

    .filter-strip {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
    }
    .filter-strip::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 6px 11px; border-radius: 8px; font-size: 0.76rem; font-weight: 600;
      background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted);
      white-space: nowrap; flex-shrink: 0; min-height: 34px;
    }
    .filter-btn.active { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
    html.dark .filter-btn.active { background: var(--blue); border-color: var(--blue); }

    .skeleton-card {
      height: 86px; border-radius: var(--radius-md);
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-alt) 50%, var(--surface) 75%);
      background-size: 200% 100%; animation: skel 1.1s infinite linear;
      border: 1px solid var(--border);

      async function uploadBusinessImages(bizId, dataUrls, folder) {
        const urls=[];
        for(let i=0;i<(dataUrls||[]).length;i++){
          const source=dataUrls[i];
          if(!source||!String(source).startsWith("data:")) { if(source) urls.push(source); continue; }
          const response=await fetch(source);
          const blob=await response.blob();
          const ext=(blob.type.split("/")[1]||"jpg").replace("jpeg","jpg").replace(/[^a-z0-9]/gi,"")||"jpg";
          const filePath=bizId+"/"+folder+"/"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
          const {error}=await supabaseClient.storage.from("zack-public-media").upload(filePath,blob,{contentType:blob.type||"image/jpeg",upsert:false});
          if(error) throw error;
          const {data}=supabaseClient.storage.from("zack-public-media").getPublicUrl(filePath);
          urls.push(data.publicUrl);
        }
        return urls;
      }

        return base+"-"+Math.random().toString(36).slice(2,7);

      async function hydrateAuthenticatedUser(authUser) {
        if (!supabaseClient || !authUser || !authUser.id) throw new Error("Session utilisateur invalide.");
        let profileResult = await supabaseClient.from("profiles")
          .select("full_name, phone, department, commune, section_communal, neighborhood, avatar_url").eq("id", authUser.id).maybeSingle();
        if (profileResult.error) throw profileResult.error;
        let profile = profileResult.data;
        if (!profile) {
          const profileName = (authUser.user_metadata && authUser.user_metadata.full_name) || (authUser.email || "").split("@")[0] || "Utilisateur Zack";
          const created = await supabaseClient.from("profiles")
            .insert({ id: authUser.id, full_name: profileName, phone: authUser.phone || null })
            .select("full_name, phone, department, commune, section_communal, neighborhood, avatar_url").single();
          if (created.error) throw created.error;
          profile = created.data;
        }
        const results = await Promise.all([
          supabaseClient.from("business_members").select("business_id, role, permissions").eq("user_id", authUser.id),
          supabaseClient.from("couriers").select("id, business_id, name, phone, vehicle, is_active").eq("user_id", authUser.id),
          supabaseClient.from("admin_roles").select("role, permissions").eq("user_id", authUser.id).maybeSingle()
        ]);
        for (const result of results) if (result.error) throw result.error;
        const memberships = results[0].data || [];
        const courierRows = results[1].data || [];
        const adminRole = results[2].data || null;
        let businessStatuses = [];
        if (memberships.length) {
          const businessIds = memberships.map((item) => item.business_id);
          const businessResult = await supabaseClient.from("businesses")
            .select("id, name, status").in("id", businessIds);
          if (businessResult.error) throw businessResult.error;
          businessStatuses = businessResult.data || [];
        }
        const hasVerifiedBusiness = businessStatuses.some((item) => item.status === "verified");
        const hasPendingBusiness = businessStatuses.some((item) => item.status === "pending");
        const roles = makeDefaultRoles({
          business: { status: hasVerifiedBusiness ? "active" : (hasPendingBusiness ? "pending" : "inactive"), verified: hasVerifiedBusiness },
          courier: { status: courierRows.some((item) => item.is_active) ? "active" : "inactive", verified: courierRows.some((item) => item.is_active) }
        });
        const isAdmin = Boolean(adminRole && (adminRole.role === "main_admin" || adminRole.role === "admin"));
        const displayName = profile.full_name || (authUser.user_metadata && authUser.user_metadata.full_name) || (authUser.email || "").split("@")[0] || "Utilisateur Zack";
        STATE.user = {
          id: authUser.id, name: displayName, email: authUser.email || "",
          phone: profile.phone || authUser.phone || "", dept: profile.department || "", commune: profile.commune || "",
          sectionCommunale: profile.section_communal || "", quartier: profile.neighborhood || "",
          avatarDataUrl: profile.avatar_url || "", coverDataUrl: "",
          isAdmin: isAdmin, roles: roles,
          businessMemberships: memberships, courierRecords: courierRows
        };
        if (isAdmin) {
          const adminId = "auth-admin-" + authUser.id;
          const currentAdmin = {
            id: adminId, name: displayName, email: authUser.email || "",
            isPrincipal: adminRole.role === "main_admin", active: true,
            roleLabel: adminRole.role === "main_admin" ? "Administrateur principal" : "Administrateur",
            permissions: adminRole.permissions || []
          };
          STATE.admins = (STATE.admins || []).filter((item) => item.id !== adminId);
          STATE.admins.push(currentAdmin);
          STATE.adminProfileId = adminId;
        }
        STATE.activeSpace = isAdmin ? "admin" : "client";
        await loadZackWorkspace();
      }

      async function initializeSupabaseAuth() {
        if (!supabaseClient) {
          STATE.authError = "Le module Supabase n'a pas pu être chargé. Vérifiez votre connexion Internet puis rechargez la page.";
          render();
          return;
        }
        await loadZackPublicData();
        supabaseClient.auth.onAuthStateChange((event) => {
          if (event === "SIGNED_OUT") {
            STATE.user = null;
            STATE.activeSpace = "client";
            if (STATE.screen !== "auth") window.app.switchRoot("auth");
          }
        });
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) {
          STATE.authError = "Impossible de restaurer la session : " + error.message;
          render();
          return;
        }
        if (data.session && data.session.user) {
          try {
            await hydrateAuthenticatedUser(data.session.user);
            window.app.switchRoot(STATE.user.isAdmin ? "admin-menu" : "home");
          } catch (profileError) {
            STATE.authError = "Session trouvée, mais profil inaccessible : " + profileError.message;
            render();
          }
        }
      }

      function compressImageDataUrl(rawDataUrl, cb) {
        if (typeof Image === "undefined" || typeof document === "undefined") {
          cb(rawDataUrl);
          return;
        }
        const img = new Image();
        img.onload = () => {
          try {
            const maxDim = 1280;
            let w = img.width || 800;
            let h = img.height || 600;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext && canvas.getContext("2d");
            if (!ctx) { cb(rawDataUrl); return; }
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL("image/jpeg", 0.8);
            cb(compressed && compressed.length < rawDataUrl.length ? compressed : rawDataUrl);
          } catch (_) {
            cb(rawDataUrl);
          }
        };
        img.onerror = () => cb(rawDataUrl);
        img.src = rawDataUrl;
      }

      function readFileAsDataUrl(file, cb) {
        if (!file || !file.type || !file.type.startsWith("image/")) {
          toast("Veuillez sélectionner un fichier image valide (JPG, PNG, WebP).");
          return;
        }
        if (file.size > 6 * 1024 * 1024) {
          toast("Image trop lourde (max 6 Mo avant compression).");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => compressImageDataUrl(reader.result, cb);
        reader.onerror = () => toast("Erreur de lecture de l'image.");
        reader.readAsDataURL(file);
      }

      function computeExploreMatches() {
        const q = STATE.searchQuery.trim().toLowerCase();
        const fq = STATE.filterQuartier.trim().toLowerCase();
        let bizList = STATE.businesses.filter((b) => b.status === "verified");
        if (STATE.filterDept) bizList = bizList.filter((b) => b.dept === STATE.filterDept);
        if (STATE.filterCommune) bizList = bizList.filter((b) => b.commune === STATE.filterCommune);
        if (fq) bizList = bizList.filter((b) => (b.quartier || "").toLowerCase().includes(fq) || (b.address || "").toLowerCase().includes(fq));
        if (STATE.filterCategory) bizList = bizList.filter((b) => b.categoryId === STATE.filterCategory);
        if (q) {
          bizList = bizList.filter((b) =>
            b.name.toLowerCase().includes(q) ||
            (b.subCategory || "").toLowerCase().includes(q) ||
            b.shortDesc.toLowerCase().includes(q) ||
            getCatName(b.categoryId).toLowerCase().includes(q) ||
            b.commune.toLowerCase().includes(q) ||
            (b.quartier || "").toLowerCase().includes(q) ||
            (b.address || "").toLowerCase().includes(q) ||
            b.dept.toLowerCase().includes(q)
          );
        }

        if (STATE.exploreSort === "rating") bizList.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        else if (STATE.exploreSort === "newest") bizList.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
        else if (STATE.exploreSort === "name") bizList.sort((a, b) => a.name.localeCompare(b.name, "fr"));
        else bizList.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

        const matchesBizFilters = (bz) => {
          if (!bz || bz.status !== "verified") return false;
          if (STATE.filterDept && bz.dept !== STATE.filterDept) return false;
          if (STATE.filterCommune && bz.commune !== STATE.filterCommune) return false;
          if (fq && !((bz.quartier || "").toLowerCase().includes(fq) || (bz.address || "").toLowerCase().includes(fq))) return false;
          if (STATE.filterCategory && bz.categoryId !== STATE.filterCategory) return false;
          return true;
        };

        const prodList = STATE.products.filter((p) => {
          if (p.hidden) return false;
          const bz = getBiz(p.bizId);
          if (!matchesBizFilters(bz)) return false;
          if (q && !(p.name.toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q) || bz.name.toLowerCase().includes(q) || bz.commune.toLowerCase().includes(q) || (bz.quartier || "").toLowerCase().includes(q))) return false;
          return true;
        });

        const srvList = STATE.services.filter((s) => {
          if (s.hidden) return false;
          const bz = getBiz(s.bizId);
          if (!matchesBizFilters(bz)) return false;
          if (q && !(s.name.toLowerCase().includes(q) || (s.desc || "").toLowerCase().includes(q) || bz.name.toLowerCase().includes(q) || bz.commune.toLowerCase().includes(q) || (bz.quartier || "").toLowerCase().includes(q))) return false;
          return true;
        });

        return { bizList, prodList, srvList };
      }

              ${s.images && s.images.length ? `<div class="thumb-strip">${s.images.map((im, i) => safeImgUrl(im) ? `<div class="thumb-item"><img src="${safeImgUrl(im)}" alt="${esc(s.name)} — photo ${i + 1}" loading="lazy" /></div>` : "").join("")}</div>` : ""}

            </div>

            <div class="form-stack">
              ${promos.map((pr) => `

                  <div class="meta"><span>Promotion</span><span>·</span><span>Jusqu'au ${esc(pr.end)}</span></div>

              ${pubs.map((p) => `
                <div class="card card-pad">
                  <div class="meta"><span>${esc(p.type)}</span><span>·</span><span class="tabular">${esc(p.date)}</span></div>

                <strong>Statut de vérification</strong>

              <div><strong>Catégorie & activités</strong><p class="small muted">${esc(getCatName(b.categoryId))}${b.subCategory ? ` · ${esc(b.subCategory)}` : ""}</p></div>

              ${(() => {

                if (!ests.length) return "";
                return `<div><strong>Établissements & points de vente (${ests.length})</strong><div class="form-stack" style="margin-top:6px;">${ests.map((est) => `<div class="small muted" style="padding:5px 8px; background:var(--surface-alt); border-radius:8px;"><strong>${esc(est.name)}</strong>${est.isMain ? ' · Principal' : ''} — ${esc(est.address)}, ${esc(est.quartier)}, ${esc(est.commune)} (${esc(est.hours)})</div>`).join("")}</div></div>`;

              <div><strong>Horaires d'ouverture</strong><p class="small muted">${esc(b.hours || "Non renseigné")}</p></div>
              <div><strong>Téléphone & WhatsApp</strong><p class="small muted">${esc(b.phone)}${b.whatsapp ? ` · WhatsApp : +${esc(safeDigits(b.whatsapp))}` : ""}</p></div>

                <div class="card card-pad">
                  <div class="flex-between"><strong>${esc(r.author)}</strong><span class="small tabular" style="color:#D97706;">★ ${r.rating}/5 · ${esc(r.date || "")}</span></div>
                  <p class="small" style="margin:6px 0;">${esc(r.comment)}</p>
                  ${r.reply ? `<div class="notice"><strong>Réponse :</strong> ${esc(r.reply)}</div>` : ""}

              <form class="card card-pad form-stack" onsubmit="app.submitReview(event, '${b.id}')">
                <strong>Laisser un avis (aperçu local)</strong>
                <div class="field">
                  <label for="revRating">Note</label>
                  <select id="revRating" class="select">
                    <option value="5">5 / 5 — Excellent</option>
                    <option value="4">4 / 5 — Très bien</option>
                    <option value="3">3 / 5 — Correct</option>
                    <option value="2">2 / 5 — Moyen</option>
                    <option value="1">1 / 5 — Insuffisant</option>
                  </select>
                </div>
                <div class="field"><label for="revComment">Commentaire</label><textarea id="revComment" class="textarea" required placeholder="Votre expérience avec cette entreprise..."></textarea></div>
                <button type="submit" class="btn btn-navy btn-sm">Enregistrer l'aperçu d'avis</button>
              </form>
            </div>
          `;

        const coverSrc = safeImgUrl(b.coverDataUrl);
        return `
          <div class="card">

              ${coverSrc ? `<img class="cover-img" src="${coverSrc}" alt="Couverture ${esc(b.name)}" />` : ""}
              ${renderBizAvatar(b, 62)}
              <div class="flex-row">
                <button type="button" class="btn btn-outline btn-sm" style="background:rgba(255,255,255,0.92); color:#0A1A4F;" onclick="app.shareEntity('biz', '${b.id}')">${esc(t("share"))}</button>
                <button type="button" class="btn btn-yellow btn-sm" onclick="app.toggleFav('${b.id}')">${isFav ? esc(t("following")) : esc(t("follow"))}</button>
              </div>
            </div>
            <div class="card-pad">
              <div class="flex-between">
                <h1 style="font-size:1.15rem; font-weight:700;">${esc(b.name)}</h1>
                ${statusBadge(b.status)}
              </div>
              <p class="small" style="margin:6px 0;">${esc(b.shortDesc)}</p>
              <div class="meta" style="margin:4px 0 12px;">
                <span>${esc(getCatName(b.categoryId))}</span>
                ${b.subCategory ? `<span>·</span><span>${esc(b.subCategory)}</span>` : ""}

              </div>
              <div class="grid-2" style="gap:8px;">
                ${b.phone ? `<a class="btn btn-outline btn-sm" href="tel:${esc(safeTel(b.phone))}">${esc(t("call"))}</a>` : ""}
                ${b.whatsapp ? `<a class="btn btn-outline btn-sm" href="https://wa.me/${esc(safeDigits(b.whatsapp))}" target="_blank" rel="noopener noreferrer">WhatsApp</a>` : ""}

      function viewProdDetail() {

        const bz = getBiz(p.bizId);
        const imgs = (p.images || []).map(safeImgUrl).filter(Boolean);
        const activeImg = imgs[STATE.selectedProdImgIdx] || imgs[0] || "";

        return `
          <div class="card">
            <div class="media-box" style="height:190px;">
              ${activeImg ? `<img src="${activeImg}" alt="${esc(p.name)}" />` : prodSvg(p.art)}
            </div>
            ${imgs.length > 1 ? `
              <div class="thumb-strip" style="padding:10px 15px 0;">
                ${imgs.map((im, idx) => `<button type="button" class="thumb-item" style="border-color:${idx === STATE.selectedProdImgIdx ? 'var(--blue)' : 'var(--border)'};" onclick="app.setProdImg(${idx})"><img src="${im}" alt="${esc(p.name)} — photo ${idx + 1}" /></button>`).join("")}
              </div>
            ` : ""}
            <div class="card-pad form-stack">
              <div class="flex-between">
                <div class="price-htg" style="font-size:1.25rem;">${money(p.priceHtg)}</div>
                <button type="button" class="btn btn-outline btn-sm" onclick="app.shareEntity('product', '${p.id}')">${esc(t("share"))}</button>
              </div>
              <h1 style="font-size:1.15rem; font-weight:700;">${esc(p.name)}</h1>
              <div class="meta"><span>${esc(p.variants || "Standard")}</span><span>·</span><span class="${p.available ? 'status-ok' : 'status-bad'}">${p.available ? 'Disponible' : 'Indisponible'}</span>${typeof p.stockQty === "number" ? `<span>·</span><span>Stock indicatif : ${p.stockQty}</span>` : ""}</div>
              ${bz ? `
                <button type="button" class="card card-pad flex-between" style="width:100%;" onclick="app.openBiz('${bz.id}')">
                  <div style="text-align:left;"><strong>${esc(bz.name)}</strong><div class="small muted">${esc(bz.commune)}, ${esc(bz.dept)}</div></div>
                  <span class="link-more">Voir la fiche</span>
                </button>
              ` : ""}
              <p class="small muted">${esc(p.desc)}</p>
              <button type="button" class="btn btn-primary btn-block" ${!p.available ? 'disabled style="opacity:0.5;"' : ''} onclick="app.addToCart('${p.id}')">${p.available ? esc(t("add_cart")) : "Produit indisponible"}</button>
              ${bz ? `<button type="button" class="btn btn-outline btn-block" onclick="app.startChatItem('${bz.id}', 'product', '${p.id}')">${esc(t("contact_seller"))}</button>` : ""}
              <button type="button" class="btn btn-outline btn-sm" onclick="app.openReportDrawer('Produit', '${p.id}')">Signaler ce produit</button>
            </div>
          </div>
        `;
      }

      function viewCart() {
        const lines = STATE.cart.map((c) => { const p = STATE.products.find((x) => x.id === c.prodId); return p ? { ...c, p } : null; }).filter(Boolean);
        if (!lines.length) return `<div class="card card-pad" style="text-align:center;"><p class="small muted" style="margin-bottom:12px;">Votre panier est vide.</p><button type="button" class="btn btn-navy" onclick="app.switchRoot('explore')">Explorer le catalogue</button></div>`;
        const groupsMap = new Map();
        lines.forEach((l) => {
          const key = l.p.bizId || "unknown";
          if (!groupsMap.has(key)) groupsMap.set(key, []);
          groupsMap.get(key).push(l);
        });
        const vendorGroups = Array.from(groupsMap.entries());
        const grandTotal = lines.reduce((s, l) => s + l.qty * l.p.priceHtg, 0);

        return `
          <div class="notice notice-info">
            <strong>Commande sécurisée :</strong> chaque vendeur reçoit sa propre commande. Le paiement se règle directement entre le client et le vendeur, en dehors de Zack.
          </div>
          ${vendorGroups.map(([bizId, items]) => {
            const bz = getBiz(bizId);
            const subTotal = items.reduce((s, l) => s + l.qty * l.p.priceHtg, 0);
            return `
              <div class="card card-pad form-stack">
                <div class="flex-between">
                  <strong>${esc(bz ? bz.name : "Boutique Zack")}</strong>
                  <span class="verified-tag">Commande distincte</span>
                </div>
                ${bz ? `<div class="small muted">${esc(bz.commune)}, ${esc(bz.dept)}</div>` : ""}
                ${items.map((l) => `
                  <div class="flex-between" style="padding:6px 0; border-bottom:1px solid var(--border);">
                    <div><strong class="small">${esc(l.p.name)}</strong><div class="small muted">${l.qty} × ${money(l.p.priceHtg)}</div></div>
                    <div class="flex-row">
                      <button type="button" class="btn btn-outline btn-sm" aria-label="Diminuer quantité" onclick="app.changeCartQty('${l.p.id}', -1)">−</button>
                      <button type="button" class="btn btn-outline btn-sm" aria-label="Augmenter quantité" onclick="app.changeCartQty('${l.p.id}', 1)">+</button>
                      <button type="button" class="btn btn-outline btn-sm" onclick="app.removeFromCart('${l.p.id}')">Retirer</button>
                    </div>
                  </div>
                `).join("")}
                <div class="flex-between" style="font-weight:700;"><span>Sous-total ${esc(bz ? bz.name : "vendeur")}</span><span>${money(subTotal)}</span></div>
                <form class="form-stack" onsubmit="app.placeOrder(event, '${esc(bizId)}')">
                  <div class="field"><label for="oName-${esc(bizId)}">Nom complet</label><input id="oName-${esc(bizId)}" class="input" required value="${esc(STATE.user ? STATE.user.name : '')}" /></div>
                  <div class="field"><label for="oPhone-${esc(bizId)}">Téléphone (+509)</label><input id="oPhone-${esc(bizId)}" class="input" required value="${esc(STATE.user ? STATE.user.phone : '')}" /></div>
                  <div class="field"><label for="oMode-${esc(bizId)}">Mode de réception</label><select id="oMode-${esc(bizId)}" class="select"><option value="delivery">Livraison</option><option value="pickup">Retrait sur place</option></select></div>
                  <div class="field"><label for="oZone-${esc(bizId)}">Zone de livraison</label><select id="oZone-${esc(bizId)}" class="select"><option value="">Choisir une zone (obligatoire pour livraison)</option>${(STATE.deliveryZones||[]).filter(z=>z.bizId===bizId).map(z=>`<option value="${z.id}">${esc(z.name)} · ${money(z.fee)}</option>`).join("")}</select></div>
                  <div class="field"><label for="oAddr-${esc(bizId)}">Adresse complète (obligatoire pour livraison)</label><input id="oAddr-${esc(bizId)}" class="input" value="${esc(STATE.user ? STATE.user.commune + ', ' + STATE.user.dept : '')}" /></div>
                  <button type="submit" class="btn btn-yellow btn-block">Commander chez ${esc(bz ? bz.name : "ce vendeur")} (${money(subTotal)})</button>
                </form>
              </div>
            `;
          }).join("")}
          ${vendorGroups.length > 1 ? `<div class="card card-pad flex-between"><strong>Total cumulé panier</strong><strong>${money(grandTotal)}</strong></div>` : ""}
        `;
      }

      function viewMessagesList() {
        const visibleConvs = STATE.conversations.filter(canViewConversation);
        const ctxLabels = { biz: "Boutique", order: "Commande", b2b: "Marché B2B", mission: "Livraison", network: "Réseau Zack", pro: "Pro" };
        return `
          <div class="notice notice-info"><strong>Messagerie contextuelle (aperçu local) :</strong> fils isolés par participants et contexte (Boutique, Commande, B2B, Mission, Réseau). Le temps réel nécessitera Supabase Realtime + RLS.</div>
          <div class="card"><div class="menu-list">
            ${visibleConvs.length ? visibleConvs.map((c) => {
              const bz = getBiz(c.bizId), last = c.messages[c.messages.length - 1];
              const badge = ctxLabels[c.contextType] || "Discussion";
              return `<button type="button" class="menu-row" onclick="app.openChat('${c.id}')"><div class="menu-row-left">${bz ? renderBizAvatar(bz, 42) : `<span class="brand-mark" style="width:42px; height:42px; font-size:0.9rem;">Z</span>`}<div style="min-width:0;flex:1;"><div class="flex-row" style="gap:6px;"><strong class="small">${esc(bz ? bz.name : (c.contextLabel || "Discussion"))}</strong><span class="verified-tag">${esc(badge)}</span>${c.blocked ? `<span class="status-pill bad">Bloquée</span>` : ""}${c.unread ? `<span class="verified-tag">${c.unread}</span>` : ""}</div><span class="small muted" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.contextLabel ? c.contextLabel + " · " : "")}${esc(last ? last.text : '')}</span></div></div><span>›</span></button>`;
            }).join("") : `<div class="card-pad small muted">Aucune conversation accessible pour votre espace actif.</div>`}
          </div></div>
        `;
      }

        if (!c) return `<div class="notice">Conversation introuvable ou accès restreint.</div>`;
        const bz = getBiz(c.bizId);
        return `
          <div class="notice notice-info">Aperçu local de discussion contextuelle (${esc(c.contextLabel || c.contextType || "Boutique")}).</div>
          <div class="card card-pad flex-between">
            <div>
              <strong>${esc(bz ? bz.name : (c.contextLabel || "Contact Zack"))}</strong>
              ${c.contextLabel ? `<div class="small muted">${esc(c.contextLabel)}</div>` : ""}
            </div>
            <div class="flex-row">
              ${bz && bz.phone ? `<a class="btn btn-outline btn-sm" href="tel:${esc(safeTel(bz.phone))}">${esc(t("call"))}</a>` : ""}
              <button type="button" class="btn btn-outline btn-sm" onclick="app.toggleBlockConv('${c.id}')">${c.blocked ? "Débloquer" : "Bloquer"}</button>
              <button type="button" class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="app.openReportDrawer('Discussion', '${c.id}')">Signaler</button>
            </div>
          </div>

        const curImgs = STATE.draftImages.length;

        const imgUploader = `
          <div class="card card-pad form-stack" style="background:var(--surface-alt);">
            <div class="flex-between">
              <strong class="small">Photos (${curImgs} / ${maxImgs} max · photos uniquement)</strong>

            ${curImgs > 0 ? `
              <div class="thumb-strip">

                  <div class="thumb-item">
                    <img src="${im}" alt="Aperçu photo ${i + 1}" />
                    <button type="button" class="thumb-del" aria-label="Supprimer photo ${i + 1}" onclick="app.removeDraftImg(${i})">×</button>
                  </div>
                `).join("")}
              </div>
            ` : ""}
            ${curImgs < maxImgs ? `
              <label class="upload-zone">
                <input type="file" accept="image/*" multiple onchange="app.handleDraftImages(event)" />
                <strong>+ Ajouter des images (compression Android auto)</strong>
                <div class="small muted">Encore ${maxImgs - curImgs} image(s) disponible(s) avec votre abonnement</div>
              </label>
            ` : `
              <div class="notice notice-warn">
                Limite de ${maxImgs} images atteinte pour <strong>${esc(biz.plan)}</strong>.

              </div>
            `}
          </div>
        `;

        let form = "";
        if (STATE.publishType === "product") {

        } else {
          body = `
            <div class="seg-control">
              <button type="button" class="seg-btn ${STATE.courierMissionFilter === "open" ? "active" : ""}" onclick="app.setCourierMissionFilter('open')">En cours (${myMissions.filter((m) => !["Terminée", "Incident"].includes(m.status)).length})</button>
              <button type="button" class="seg-btn ${STATE.courierMissionFilter === "done" ? "active" : ""}" onclick="app.setCourierMissionFilter('done')">Terminées / Incidents (${myMissions.filter((m) => ["Terminée", "Incident"].includes(m.status)).length})</button>

              const bz = getBiz(m.bizId);

        return `
          <div class="notice notice-ok">
            <strong>Espace Livreur 100% GRATUIT à vie :</strong> aucun abonnement MonCash requis pour les livreurs sur Zack.

            <button type="button" class="tab-item ${STATE.courierTab === "earnings" ? "active" : ""}" onclick="app.setCourierTab('earnings')">Activité & Courses</button>
          </div>

      /* =========================================================
         9D. PHASE 6 : RÉSEAU ZACK (TOUTES RELATIONS STRUCTURÉES)
         ========================================================= */
      function viewNetworkHome() {
        if (!STATE.user) {
          return `<div class="narrow-wrap card card-pad form-stack"><p class="small muted">Connectez-vous pour consulter et gérer vos relations Réseau Zack.</p><button type="button" class="btn btn-primary btn-block" onclick="app.switchRoot('auth')">Se connecter</button></div>`;
        }
        const rels = STATE.networkRelations.filter((r) => {
          if (STATE.networkPairFilter && r.pairType !== STATE.networkPairFilter) return false;
          if (STATE.networkTab === "active") return r.status === "Active" || r.status === "Acceptée";
          if (STATE.networkTab === "pending") return r.status === "Invitation envoyée" || r.status === "En attente";
          if (STATE.networkTab === "closed") return ["Refusée", "Expirée", "Suspendue", "Terminée", "Révoquée"].includes(r.status);
          return true;
        });

        return `
          <div class="notice notice-info">
            <strong>Réseau Zack (aperçu local) :</strong> gérez vos relations structurées avec historique et permissions (10 types de liens entre clients, professionnels, livreurs, fournisseurs, revendeurs et entreprises).
          </div>
          <div class="tabs-bar">
            <button type="button" class="tab-item ${STATE.networkTab === "all" ? "active" : ""}" onclick="app.setFilter('networkTab', 'all')">Toutes (${STATE.networkRelations.length})</button>
            <button type="button" class="tab-item ${STATE.networkTab === "active" ? "active" : ""}" onclick="app.setFilter('networkTab', 'active')">Actives</button>
            <button type="button" class="tab-item ${STATE.networkTab === "pending" ? "active" : ""}" onclick="app.setFilter('networkTab', 'pending')">En attente</button>
            <button type="button" class="tab-item ${STATE.networkTab === "closed" ? "active" : ""}" onclick="app.setFilter('networkTab', 'closed')">Suspendues / Clôturées</button>
          </div>

          <div class="card card-pad">
            <div class="field">
              <label for="netPairSel">Filtrer par type de relation (10)</label>
              <select id="netPairSel" class="select" onchange="app.setFilter('networkPairFilter', this.value)">
                <option value="">Tous les types de relations</option>
                ${NETWORK_PAIR_TYPES.map((pt) => `<option value="${pt.id}" ${STATE.networkPairFilter === pt.id ? "selected" : ""}>${esc(pt.label)}</option>`).join("")}
              </select>
            </div>
          </div>

          <form class="card card-pad form-stack" onsubmit="app.createNetworkRelation(event)">
            <strong>+ Inviter / créer une relation Réseau Zack</strong>
            <div class="field">
              <label for="nrPair">Type de lien *</label>
              <select id="nrPair" class="select">
                ${NETWORK_PAIR_TYPES.map((pt) => `<option value="${pt.id}">${esc(pt.label)}</option>`).join("")}
              </select>
            </div>
            <div class="grid-2">
              <div class="field"><label for="nrTarget">Destinataire / Partenaire *</label><input id="nrTarget" class="input" required placeholder="Nom de l'entreprise ou personne..." /></div>
              <div class="field"><label for="nrRole">Intitulé du rôle *</label><input id="nrRole" class="input" required placeholder="Ex. Grossiste, Revendeur Nord..." /></div>
            </div>
            <div class="grid-2">
              <div class="field"><label for="nrPerms">Permissions (séparées par virgules)</label><input id="nrPerms" class="input" placeholder="Ex. Tarifs gros, Commandes B2B" /></div>
              <div class="field"><label for="nrExp">Date d'expiration</label><input id="nrExp" type="date" class="input" value="2027-06-30" /></div>
            </div>
            <div class="field"><label for="nrCond">Conditions & périmètre</label><input id="nrCond" class="input" placeholder="Ex. Paiement à livraison, zone Ouest..." /></div>
            <button type="submit" class="btn btn-navy btn-block">Envoyer l'invitation (anti-doublon actif)</button>
          </form>

          ${rels.map((r) => {
            const pairInfo = NETWORK_PAIR_TYPES.find((p) => p.id === r.pairType);
            const pillCls = r.status === "Active" || r.status === "Acceptée" ? "ok" : (r.status === "Invitation envoyée" || r.status === "En attente") ? "warn" : "bad";
            return `
              <div class="card card-pad form-stack">
                <div class="flex-between">
                  <span class="verified-tag">${esc(pairInfo ? pairInfo.label : r.pairType)}</span>
                  <span class="status-pill ${pillCls}">${esc(r.status)}</span>
                </div>
                <strong>${esc(r.initiatorLabel)} ↔ ${esc(r.targetLabel)}</strong>
                <div class="small"><strong>Rôle :</strong> ${esc(r.roleLabel)}</div>
                ${r.conditions ? `<div class="small muted">${esc(r.conditions)}</div>` : ""}
                ${r.permissions && r.permissions.length ? `<div class="meta">${r.permissions.map((pm) => `<span class="verified-tag">${esc(pm)}</span>`).join("")}</div>` : ""}
                <div class="small muted">Créée le ${esc(r.createdAt)} · Expiration : ${esc(r.expiresAt || "Aucune")}</div>
                <div class="flex-row">
                  ${["Invitation envoyée", "En attente"].includes(r.status) ? `
                    <button type="button" class="btn btn-primary btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Active')">Accepter & Activer</button>
                    <button type="button" class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="app.transitionNetworkRelation('${r.id}', 'Refusée')">Refuser</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Révoquée')">Révoquer</button>
                  ` : r.status === "Acceptée" ? `
                    <button type="button" class="btn btn-primary btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Active')">Activer</button>
                  ` : r.status === "Active" ? `
                    <button type="button" class="btn btn-outline btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Suspendue')">Suspendre</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Terminée')">Terminer</button>
                    <button type="button" class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="app.transitionNetworkRelation('${r.id}', 'Révoquée')">Révoquer</button>
                  ` : r.status === "Suspendue" ? `
                    <button type="button" class="btn btn-primary btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Active')">Réactiver</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="app.transitionNetworkRelation('${r.id}', 'Terminée')">Terminer</button>
                  ` : ""}
                </div>
                ${r.history && r.history.length ? `<div class="small muted" style="font-size:0.7rem;">Historique : ${esc(r.history.slice(-2).join(" → "))}</div>` : ""}
              </div>
            `;
          }).join("") || `<div class="notice">Aucune relation dans cette sélection.</div>`}
        `;
      }

      /* =========================================================
         9E. PHASE 7 : MARCHÉ PROFESSIONNEL B2B (15 CATÉGORIES)
         ========================================================= */
      function isB2bJobCategory(cat) {
        return cat === "Emploi / Offre d'emploi" || cat === "Demande d'emploi / Candidature";
      }

      function viewB2bMarket() {
        const myUid = STATE.user ? STATE.user.id : "";
        const filtered = STATE.b2bPosts.filter((p) => {
          if (STATE.b2bTab === "mine") return myUid && p.authorUserId === myUid;
          if (STATE.b2bTab === "saved") return STATE.b2bSavedIds.includes(p.id);
          if (p.status === "Brouillon" || p.status === "Suspendue") return false;
          if (STATE.b2bKindFilter && p.kind !== STATE.b2bKindFilter) return false;
          if (STATE.b2bCatFilter && p.category !== STATE.b2bCatFilter) return false;
          if (STATE.b2bDeptFilter && p.dept !== STATE.b2bDeptFilter) return false;
          if (STATE.b2bSearch) {
            const q = STATE.b2bSearch.toLowerCase();
            if (!`${p.title} ${p.category} ${p.authorName} ${p.summary} ${p.commune}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });

        let body = "";
        if (STATE.b2bTab === "create") {
          body = `
            <div class="notice notice-ok">
              <strong>Gratuité garantie :</strong> la publication et la candidature pour <em>Emploi / Offre d'emploi</em> et <em>Demande d'emploi / Candidature</em> restent 100% gratuites.
            </div>

              <strong>+ Publier une annonce sur le Marché B2B</strong>

                  <select id="b2bKind" class="select"><option value="Offre">Offre (je propose)</option><option value="Demande">Demande (je recherche)</option></select>
                </div>
                <div class="field"><label for="b2bCat">Catégorie (15) *</label>
                  <select id="b2bCat" class="select">${B2B_CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
                </div>
              </div>
              <div class="field"><label for="b2bTitle">Titre de l'annonce *</label><input id="b2bTitle" class="input" required placeholder="Ex. Appel d'offres fourniture solaire, Recherche chauffeur..." /></div>
              <div class="grid-2">
                <div class="field"><label for="b2bDept">Département *</label><select id="b2bDept" class="select">${Object.keys(HAITI_GEO).map((d) => `<option>${esc(d)}</option>`).join("")}</select></div>
                <div class="field"><label for="b2bComm">Commune *</label><input id="b2bComm" class="input" required placeholder="Ex. Pétion-Ville" /></div>
              </div>
              <div class="grid-2">
                <div class="field"><label for="b2bBudget">Budget / Tarif HTG (0 = À négocier)</label><input id="b2bBudget" type="number" min="0" class="input" value="0" /></div>
                <div class="field"><label for="b2bQty">Volume / Quantité / Postes</label><input id="b2bQty" class="input" placeholder="Ex. 50 unités, 2 postes..." /></div>
              </div>
              <div class="grid-2">
                <div class="field"><label for="b2bDead">Date limite</label><input id="b2bDead" type="date" class="input" value="2026-12-31" /></div>
                <div class="field"><label for="b2bStatus">Statut initial</label><select id="b2bStatus" class="select"><option value="Publiée">Publier maintenant</option><option value="Brouillon">Enregistrer en brouillon</option></select></div>
              </div>
              <div class="field"><label for="b2bTerms">Conditions / Profil / Exigences</label><input id="b2bTerms" class="input" placeholder="Ex. Devis détaillé requis, livraison..." /></div>
              <div class="field"><label for="b2bSum">Description détaillée *</label><textarea id="b2bSum" class="textarea" required placeholder="Précisez votre besoin ou votre offre..."></textarea></div>
              <button type="submit" class="btn btn-navy btn-block">Enregistrer l'annonce B2B</button>
            </form>
          `;
        } else {
          body = `
            <div class="card card-pad form-stack">
              <input id="b2bSearchInp" type="search" class="input" aria-label="Rechercher sur le marché B2B" placeholder="Rechercher offre, appel d'offres, emploi, gros..." value="${esc(STATE.b2bSearch)}" oninput="app.setFilter('b2bSearch', this.value)" />
              <div class="grid-2">
                <select class="select" aria-label="Filtrer Offre ou Demande" onchange="app.setFilter('b2bKindFilter', this.value)">
                  <option value="">Offres & Demandes</option>
                  <option value="Offre" ${STATE.b2bKindFilter === "Offre" ? "selected" : ""}>Offres uniquement</option>
                  <option value="Demande" ${STATE.b2bKindFilter === "Demande" ? "selected" : ""}>Demandes uniquement</option>
                </select>
                <select class="select" aria-label="Filtrer par département" onchange="app.setFilter('b2bDeptFilter', this.value)">
                  <option value="">Toute Haïti</option>
                  ${Object.keys(HAITI_GEO).map((d) => `<option value="${esc(d)}" ${STATE.b2bDeptFilter === d ? "selected" : ""}>${esc(d)}</option>`).join("")}
                </select>
              </div>
              <select class="select" aria-label="Filtrer par catégorie B2B" onchange="app.setFilter('b2bCatFilter', this.value)">
                <option value="">Toutes les catégories B2B (15)</option>
                ${B2B_CATEGORIES.map((c) => `<option value="${esc(c)}" ${STATE.b2bCatFilter === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
              </select>
            </div>

            ${filtered.map((p) => {
              const isJob = isB2bJobCategory(p.category);
              const isMine = myUid && p.authorUserId === myUid;
              const saved = STATE.b2bSavedIds.includes(p.id);
              const stCls = p.status === "Publiée" ? "ok" : ["Pourvue", "Satisfaite", "En cours de traitement"].includes(p.status) ? "warn" : "bad";
              return `
                <div class="card card-pad form-stack">
                  <div class="flex-between">
                    <span class="verified-tag">${esc(p.kind)} · ${esc(p.category)}</span>
                    <span class="status-pill ${stCls}">${esc(p.status)}</span>
                  </div>

                  <div class="small muted">${esc(p.authorName)} · ${esc(p.commune)}, ${esc(p.dept)} · Limite : ${esc(p.deadline)}</div>
                  <p class="small">${esc(p.summary)}</p>
                  <div class="small muted">${p.quantityOrVolume ? `Volume : <strong>${esc(p.quantityOrVolume)}</strong> · ` : ""}${p.budgetHtg > 0 ? `Budget/Prix : <strong>${money(p.budgetHtg)}</strong>` : "Tarif à négocier"}</div>
                  ${p.contractOrTerms ? `<div class="small muted"><em>${esc(p.contractOrTerms)}</em></div>` : ""}
                  <div class="flex-row">
                    ${isJob ? `
                      <button type="button" class="btn btn-primary btn-sm" onclick="app.applyFreeJob('${p.id}', '${esc(p.title)}', '${esc(p.authorName)}')">Postuler (100% Gratuit)</button>

                      <button type="button" class="btn btn-primary btn-sm" onclick="app.openB2bReplyDrawer('${p.id}')">${p.category === "Partenariat commercial" ? "Proposer partenariat" : p.kind === "Demande" ? "Envoyer un devis / réponse" : "Contacter / Demander devis"}</button>

                  </div>
                  ${p.responses && p.responses.length ? `<div class="small muted">${p.responses.length} réponse(s) / devis reçu(s) localement</div>` : ""}
                  ${isMine ? `
                    <div class="flex-between" style="padding-top:6px; border-top:1px solid var(--border);">
                      <span class="small muted">Gestion auteur :</span>
                      <select class="select" aria-label="Changer statut annonce ${esc(p.title)}" style="width:auto; padding:4px 8px; font-size:0.75rem;" onchange="app.setB2bPostStatus('${p.id}', this.value)">
                        ${["Brouillon", "Publiée", "En cours de traitement", "Pourvue", "Satisfaite", "Expirée", "Fermée"].map((st) => `<option ${p.status === st ? "selected" : ""}>${st}</option>`).join("")}
                      </select>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("") || `<div class="notice">Aucune annonce B2B trouvée pour ces filtres.</div>`}
          `;
        }

        return `
          <div class="tabs-bar">
            <button type="button" class="tab-item ${STATE.b2bTab === "browse" ? "active" : ""}" onclick="app.setFilter('b2bTab', 'browse')">Explorer (${STATE.b2bPosts.filter((x) => !["Brouillon", "Suspendue"].includes(x.status)).length})</button>
            <button type="button" class="tab-item ${STATE.b2bTab === "create" ? "active" : ""}" onclick="app.setFilter('b2bTab', 'create')">+ Publier B2B</button>

      function admDenied(msg) {
        return `
          <div class="notice notice-warn">

      function viewAdminMenu() {
        const cur = getCurrentAdmin();

          { id: "admin-dashboard", title: "Tableau de bord", sub: "Statistiques et activité générale", perm: "view_dashboard", principalOnly: false },

          { id: "admin-users", title: "Utilisateurs", sub: "Comptes et gestion des accès", perm: "manage_users", principalOnly: false },
          { id: "admin-publications", title: "Publications", sub: "Modération et annonces", perm: "moderate_content", principalOnly: false },
          { id: "admin-plans", title: "Abonnements", sub: "Forfaits Gratuit, Pro et Ultra", perm: "manage_plans", principalOnly: true },
          { id: "admin-payments", title: "Paiements", sub: `MonCash, comptes et vérifications${pendPay ? ` · ${pendPay} à vérifier` : ""}`, perm: "verify_payments", principalOnly: false },

          { id: "admin-settings", title: "Paramètres", sub: "Configuration générale de Zack", perm: "platform_settings", principalOnly: true },
          { id: "admin-admins", title: "Administrateurs", sub: isPrin ? "Rôles, permissions et journal d'audit" : "Journal d'audit (gestion admins réservée au Principal)", perm: "view_audit_logs", principalOnly: false, lockNote: isPrin ? "" : "Partiel" }

          <div class="card card-pad form-stack">

                ${STATE.admins.filter((a) => a.active !== false).map((a) => `<option value="${a.id}" ${a.id === cur.id ? 'selected' : ''}>${esc(a.name)} — ${a.isPrincipal ? 'Administrateur principal' : 'Administrateur ordinaire'}</option>`).join("")}
