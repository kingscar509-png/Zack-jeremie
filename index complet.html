      function viewAdminDashboard() {
        if (!hasAdm("view_dashboard")) return admDenied("Permission view_dashboard requise.");
        const bizTotal = STATE.businesses.length;
        const bizPend = STATE.businesses.filter((b) => b.status === "pending" || b.status === "correction_requested").length;
        const bizVer = STATE.businesses.filter((b) => b.status === "verified").length;
        const bizRef = STATE.businesses.filter((b) => b.status === "rejected").length;
        const bizSusp = STATE.businesses.filter((b) => b.status === "suspended").length;
        const userTotal = STATE.adminUsers.length;
        const courierTotal = STATE.couriers.length;
        const proTotal = STATE.proProfiles.length;
        const b2bTotal = (STATE.b2bPosts || []).length;
        const relTotal = (STATE.networkRelations || []).length;
        const ordTotal = STATE.orders.length;
        const pubTotal = STATE.products.length + STATE.services.length + STATE.publications.length + STATE.promotions.length + STATE.events.length + b2bTotal;
        const subFree = STATE.businesses.filter((b) => b.plan === "Gratuit").length;
        const subPro = STATE.businesses.filter((b) => b.plan === "Pro").length;
        const subUltra = STATE.businesses.filter((b) => b.plan === "Ultra").length;
        const grantsCount = (STATE.subscriptionGrants || []).length;
        const revValid = STATE.moncashPayments.filter((p) => p.status === "verified" && !p.excludedFromRevenue).reduce((s, p) => s + Number(p.amountHtg || 0), 0);
        const payPend = STATE.moncashPayments.filter((p) => p.status === "pending").length;
        const openIssues = STATE.reports.filter((r) => r.status === "Ouvert").length + STATE.supportTickets.filter((s) => s.status === "Ouvert").length;

        const breakdownMap = {};
        STATE.businesses.forEach((b) => {
          const k = STATE.admDashMetric === "dept" ? b.dept : STATE.admDashMetric === "commune" ? `${b.commune} (${b.dept})` : getCatName(b.categoryId);
          breakdownMap[k] = (breakdownMap[k] || 0) + 1;
        });
        const breakdown = Object.entries(breakdownMap).sort((a, b) => b[1] - a[1]);

        return `
          <div class="demo-banner">
            <span>Indicateurs calculés en direct sur les données locales de l'aperçu (avant connexion Supabase).</span>
          </div>

          <div class="kpi-grid">
            <div class="kpi-card"><span class="kpi-val">${bizTotal}</span><span class="kpi-lbl">Entreprises inscrites</span></div>
            <div class="kpi-card"><span class="kpi-val">${bizPend}</span><span class="kpi-lbl">En attente vérif.</span></div>
            <div class="kpi-card"><span class="kpi-val">${bizVer}</span><span class="kpi-lbl">Vérifiées</span></div>
            <div class="kpi-card"><span class="kpi-val">${bizRef} / ${bizSusp}</span><span class="kpi-lbl">Refusées / Suspendues</span></div>
            <div class="kpi-card"><span class="kpi-val">${userTotal}</span><span class="kpi-lbl">Utilisateurs inscrits</span></div>
            <div class="kpi-card"><span class="kpi-val">${proTotal} / ${courierTotal}</span><span class="kpi-lbl">Pros / Livreurs (gratuits)</span></div>
            <div class="kpi-card"><span class="kpi-val">${pubTotal}</span><span class="kpi-lbl">Publications & B2B</span></div>
            <div class="kpi-card"><span class="kpi-val">${relTotal} / ${ordTotal}</span><span class="kpi-lbl">Réseau / Commandes</span></div>
            <div class="kpi-card"><span class="kpi-val">${payPend}</span><span class="kpi-lbl">MonCash à vérifier</span></div>
            <div class="kpi-card"><span class="kpi-val">${openIssues}</span><span class="kpi-lbl">Signalements & tickets</span></div>
          </div>

          <div class="card card-pad form-stack">
            <div class="flex-between">
              <strong>Abonnements & Revenus MonCash (aperçu)</strong>
              <span class="price-htg">${money(revValid)}</span>
            </div>
            <div class="small muted">${grantsCount} abonnement(s) offert(s) par l'administration (exclus des revenus · 0 HTG).</div>
            <div class="grid-2" style="grid-template-columns:repeat(3, 1fr);">
              <div class="kpi-card"><span class="kpi-val" style="font-size:1.05rem;">${subFree}</span><span class="kpi-lbl">Gratuit</span></div>
              <div class="kpi-card"><span class="kpi-val" style="font-size:1.05rem;">${subPro}</span><span class="kpi-lbl">Pro</span></div>
              <div class="kpi-card"><span class="kpi-val" style="font-size:1.05rem;">${subUltra}</span><span class="kpi-lbl">Ultra</span></div>
            </div>
          </div>

          <div class="card card-pad form-stack">
            <div class="flex-between">
              <strong>Répartition des entreprises</strong>
              <select class="select" aria-label="Critère de statistique" style="width:auto; padding:5px 8px; font-size:0.76rem;" onchange="app.setFilter('admDashMetric', this.value)">
                <option value="dept" ${STATE.admDashMetric === 'dept' ? 'selected' : ''}>Par département</option>
                <option value="commune" ${STATE.admDashMetric === 'commune' ? 'selected' : ''}>Par commune</option>
                <option value="category" ${STATE.admDashMetric === 'category' ? 'selected' : ''}>Par catégorie</option>
              </select>
            </div>
            ${breakdown.map(([label, count]) => `
              <div class="flex-between" style="padding:5px 0; border-bottom:1px solid var(--border);">
                <span class="small">${esc(label)}</span>
                <strong class="small tabular">${count}</strong>
              </div>
            `).join("")}
          </div>

          <div class="card card-pad form-stack">
            <div class="flex-between">
              <strong>Activité récente sur Zack</strong>
              <button type="button" class="link-more" onclick="app.open('admin-admins')">Journal complet</button>
            </div>
            ${STATE.auditLogs.slice(0, 5).map((l) => `
              <div style="padding:6px 0; border-bottom:1px solid var(--border);">
                <div class="small"><strong>${esc(l.actor)}</strong></div>
                <div class="small muted">${esc(l.action)} · ${esc(l.time)}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      function renderAdmBusinessesList() {
        const q = STATE.admBizQuery.trim().toLowerCase();
        const st = STATE.admBizStatus;
        const list = STATE.businesses.filter((b) => {
          if (st !== "all" && b.status !== st) return false;
          if (!q) return true;
          return (
            b.name.toLowerCase().includes(q) ||
            (b.phone || "").toLowerCase().includes(q) ||
            getCatName(b.categoryId).toLowerCase().includes(q) ||
            b.dept.toLowerCase().includes(q) ||
            b.commune.toLowerCase().includes(q) ||
            (b.quartier || "").toLowerCase().includes(q)
          );
        });
        if (!list.length) return `<div class="notice">Aucune entreprise ne correspond à ces critères.</div>`;
        return list.map((b) => `
          <div class="card card-pad form-stack">
            <div class="flex-between">
              <div>
                <strong>${esc(b.name)}</strong>
                <div class="small muted">${esc(getCatName(b.categoryId))} · ${esc(b.commune)}, ${esc(b.dept)} · ${esc(b.phone)}</div>
              </div>
              ${statusBadge(b.status)}
            </div>
            <div class="flex-between small muted">
              <span>Forfait : <strong>${esc(b.plan)}</strong> ${b.featured ? "· ★ Mise en avant" : ""}</span>
              <span>Docs : ${b.documentsVerified ? "Vérifiés ✓" : "À contrôler"}</span>
            </div>
            <div class="flex-row">
              <button type="button" class="btn btn-navy btn-sm" onclick="app.admManageBiz('${b.id}')">Gérer / Vérifier</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="app.openBiz('${b.id}')">Fiche publique</button>
            </div>
          </div>
        `).join("");
      }

      function viewAdminBusinesses() {
        if (!hasAdm("manage_businesses")) return admDenied("Permission manage_businesses requise.");
        return `
          <div class="card card-pad form-stack">
            <input id="admBizSearchInp" type="search" class="input" aria-label="Rechercher une entreprise" placeholder="Nom, téléphone, catégorie ou commune..." value="${esc(STATE.admBizQuery)}" oninput="app.onAdmBizSearch(this.value)" />
            <div class="filter-strip">
              ${[
                ["all", "Toutes"], ["pending", "En attente"], ["verified", "Vérifiées"],
                ["correction_requested", "Corrections"], ["rejected", "Refusées"], ["suspended", "Suspendues"]
              ].map(([k, lbl]) => `
                <button type="button" class="filter-btn ${STATE.admBizStatus === k ? 'active' : ''}" onclick="app.setFilter('admBizStatus', '${k}')">${lbl}</button>
              `).join("")}
            </div>
          </div>
          <div id="admBizListWrap" class="form-stack">${renderAdmBusinessesList()}</div>
        `;
      }

      function viewAdminBizManage() {
        if (!hasAdm("manage_businesses")) return admDenied("Permission manage_businesses requise.");
        const b = getBiz(STATE.admSelectedBizId) || STATE.businesses[0];
        if (!b) return `<div class="notice">Entreprise introuvable.</div>`;
        const canVer = hasAdm("verify_businesses");
        const staff = STATE.teamMembers.filter((m) => m.bizId === b.id);
        const owners = STATE.adminUsers.filter((u) => (u.managedBizIds || []).includes(b.id));
        const bizLogs = STATE.auditLogs.filter((l) => l.action.toLowerCase().includes(b.name.toLowerCase()));

        return `
          <div class="card card-pad form-stack">
            <div class="flex-between">
              <strong style="font-size:1.05rem;">${esc(b.name)}</strong>
              ${statusBadge(b.status)}
            </div>
            <p class="small muted">${esc(b.longDesc)}</p>
            <div class="small"><strong>Catégorie :</strong> ${esc(getCatName(b.categoryId))} ${b.subCategory ? `(${esc(b.subCategory)})` : ""}</div>
            <div class="small"><strong>Localisation :</strong> ${esc(b.address)}, ${esc(b.quartier)}, ${esc(b.commune)} (${esc(b.dept)})</div>
            <div class="small"><strong>Contacts :</strong> ${esc(b.phone)} ${b.email ? `· ${esc(b.email)}` : ""}</div>
            <div class="small"><strong>Documents & vérification :</strong> ${b.documentsVerified ? '<span class="status-ok">Documents contrôlés ✓</span>' : '<span class="status-warn">En attente de contrôle documentaire</span>'}</div>
            ${b.correctionNote ? `<div class="notice notice-warn"><strong>Note de correction envoyée :</strong> ${esc(b.correctionNote)}</div>` : ""}
            <button type="button" class="btn btn-outline btn-sm" onclick="app.openBiz('${b.id}')">Aperçu fiche publique</button>
          </div>

          <div class="card card-pad form-stack">
            <strong>Décisions administratives & validation officielle</strong>
            <div class="grid-2">
              ${canVer ? `<button type="button" class="btn btn-success btn-sm" onclick="app.admBizAction('${b.id}', 'verify')">✓ Approuver & Badge vérifié</button>` : ""}
              ${canVer ? `<button type="button" class="btn btn-outline btn-sm" onclick="app.admBizAction('${b.id}', 'toggleDocs')">${b.documentsVerified ? 'Retirer vérif. docs' : 'Valider documents'}</button>` : ""}
              ${canVer && b.status === 'verified' ? `<button type="button" class="btn btn-outline btn-sm" onclick="app.admBizAction('${b.id}', 'unbadge')">Retirer badge vérifiée</button>` : ""}
              ${canVer ? `<button type="button" class="btn btn-outline btn-sm" onclick="app.admBizAction('${b.id}', 'reject')">Refuser l'inscription</button>` : ""}
              ${b.status !== 'suspended' ? `<button type="button" class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="app.admBizAction('${b.id}', 'suspend')">Suspendre</button>` : `<button type="button" class="btn btn-primary btn-sm" onclick="app.admBizAction('${b.id}', 'reactivate')">Réactiver</button>`}
              <button type="button" class="btn btn-yellow btn-sm" onclick="app.admBizAction('${b.id}', 'toggleFeatured')">${b.featured ? 'Retirer mise en avant' : '★ Mettre en avant'}</button>
            </div>
            ${canVer ? `
              <form class="form-stack" onsubmit="app.admSendCorrection(event, '${b.id}')">
                <div class="field">
                  <label for="admCorrNote">Demander des corrections au propriétaire</label>
                  <input id="admCorrNote" class="input" required placeholder="Ex. Merci de préciser l'adresse exacte ou la patente..." value="${esc(b.correctionNote || '')}" />
                </div>
                <button type="submit" class="btn btn-navy btn-sm">Envoyer demande de correction</button>
              </form>
            ` : ""}
          </div>

          <div class="card card-pad form-stack">
            <strong>Propriétaires & membres associés (${owners.length + staff.length})</strong>
            ${owners.map((u) => `<div class="small"><strong>Propriétaire / Compte :</strong> ${esc(u.name)} (${esc(u.email)})</div>`).join("")}
            ${staff.map((m) => `<div class="small muted">${esc(m.name)} — ${esc(m.role)} (${esc(m.email)})</div>`).join("") || `<div class="small muted">Aucun staff enregistré.</div>`}
          </div>

          <div class="card card-pad form-stack">
            <strong>Historique lié à cette entreprise (${bizLogs.length})</strong>
            ${bizLogs.length ? bizLogs.map((l) => `<div class="small muted"><strong>${esc(l.time)}</strong> · ${esc(l.actor)} : ${esc(l.action)}</div>`).join("") : `<div class="small muted">Aucune entrée d'historique récente.</div>`}

      function renderAdmUsersList() {
        const q = STATE.admUserQuery.trim().toLowerCase();
        const list = STATE.adminUsers.filter((u) => !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || (u.phone || "").toLowerCase().includes(q));
        if (!list.length) return `<div class="notice">Aucun utilisateur trouvé.</div>`;
        return list.map((u) => {
          const bizNames = (u.managedBizIds || []).map((id) => { const bz = getBiz(id); return bz ? bz.name : id; });
          const userReps = STATE.reports.filter((r) => r.userId === u.id);
          return `
            <div class="card card-pad form-stack">
              <div class="flex-between">
                <div>
                  <strong>${esc(u.name)}</strong>
                  <div class="small muted">${esc(u.email)} · ${esc(u.phone)}</div>
                </div>
                <span class="status-pill ${u.status === 'active' ? 'ok' : 'bad'}">${u.status === 'active' ? 'Actif' : 'Suspendu'}</span>
              </div>
              <div class="small muted">${esc(u.commune)}, ${esc(u.dept)} · Inscrit le ${esc(u.joinedAt)}</div>
              <div class="small"><strong>Entreprises gérées :</strong> ${bizNames.length ? esc(bizNames.join(", ")) : "Aucune"}</div>
              ${userReps.length ? `<div class="small status-warn">Signalement(s) lié(s) : ${userReps.length}</div>` : ""}

                <button type="button" class="btn btn-outline btn-sm" onclick="app.admUserToggleStatus('${u.id}')">${u.status === 'active' ? 'Suspendre le compte' : 'Réactiver le compte'}</button>

      window.app = {
        switchRoot(scr) {
          if (!canAccessRoot(scr)) {
            toast("Cet espace n'est pas autorisé pour les rôles de votre compte.");
            return;
          }
          STATE.history = []; STATE.screen = scr; render();
        },
        open(scr) {
          if (!canAccessRoot(scr)) {
            toast("Cet espace n'est pas autorisé pour les rôles de votre compte.");
            return;
          }
          if (STATE.screen !== scr) STATE.history.push(STATE.screen); STATE.screen = scr; render();
        },
        back() {
          const previous = STATE.history.pop() || "home";
          STATE.screen = canAccessRoot(previous) ? previous : "home";
          render();
        },
        setViewport(m) {
          STATE.viewport = m;
          const sh = document.getElementById("appShell");
          sh.classList.toggle("mode-916", m === "916");

          const name = (document.getElementById("regName").value || "").trim();

          if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) { STATE.authError = "Veuillez saisir une adresse e-mail valide."; render(); return; }

          const { data, error } = await supabaseClient.auth.signUp({

            password: password,
            options: { data: { full_name: name } }

          if (error) {
            STATE.authError = "Création du compte impossible : " + error.message;

        useGeolocation() {
          if (!navigator.geolocation) {
            STATE.exploreError = "La géolocalisation n'est pas prise en charge par votre navigateur.";
            render();
            return;
          }
          STATE.exploreError = "";
          STATE.exploreLoading = true;
          render();
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              STATE.exploreLoading = false;
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              let detectedDept = "";
              if (lat >= 18.0 && lat <= 20.2 && lng >= -74.6 && lng <= -71.5) {
                if (lat > 19.45 && lng > -72.55) detectedDept = "Nord";
                else if (lat > 19.45 && lng <= -72.55) detectedDept = "Nord-Ouest";
                else if (lat > 18.8 && lng <= -72.25) detectedDept = "Artibonite";
                else if (lat > 18.75 && lng > -72.25) detectedDept = "Centre";
                else if (lng < -73.75 && lat >= 18.45) detectedDept = "Grand'Anse";
                else if (lng < -73.0 && lat >= 18.38) detectedDept = "Nippes";
                else if (lng < -73.15 && lat < 18.38) detectedDept = "Sud";
                else if (lat < 18.42 && lng >= -72.9) detectedDept = "Sud-Est";
                else detectedDept = "Ouest";
              }
              if (detectedDept) {
                STATE.filterDept = detectedDept;
                STATE.filterCommune = "";
                STATE.filterQuartier = "";
                toast("Position détectée : " + detectedDept);
              } else {
                toast("Position détectée hors d'Haïti : sélectionnez un département manuellement.");
              }
              render();
            },
            () => {
              STATE.exploreLoading = false;
              STATE.exploreError = "Autorisation GPS refusée ou signal indisponible. Vous pouvez filtrer par département ci-dessus.";
              render();
            },
            { timeout: 6000 }
          );
        },

        saveAdminPlans(e) {
          e.preventDefault();
          if (!hasAdm("manage_plans")) { toast("Réservé à l'Administrateur principal."); return; }
          const entries = Object.entries(STATE.plans);
          const next = {};
          const renameMap = {};
          const d = new Date(), pad = (n) => String(n).padStart(2, "0");
          const today = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          for (let idx = 0; idx < entries.length; idx++) {
            const [oldName, oldInfo] = entries[idx];
            const newName = (document.getElementById("planName-" + idx).value || "").trim() || oldName;
            const price = Math.max(0, Math.round(Number(document.getElementById("planPrice-" + idx).value)));
            const durDays = Math.max(0, Math.min(1095, Math.round(Number(document.getElementById("planDurDays-" + idx).value || 0))));
            const durLbl = (document.getElementById("planDurLbl-" + idx).value || "").trim() || (durDays ? `${durDays} jours` : "Illimitée");
            const imgs = Math.max(1, Math.min(30, Math.round(Number(document.getElementById("planImg-" + idx).value))));
            const maxEstEl = document.getElementById("planEst-" + idx);
            const maxStaffEl = document.getElementById("planStaff-" + idx);
            const maxEst = maxEstEl ? Math.max(1, Math.min(100, Math.round(Number(maxEstEl.value || 1)))) : (oldInfo.maxEstablishments || 1);
            const maxStaff = maxStaffEl ? Math.max(1, Math.min(200, Math.round(Number(maxStaffEl.value || 2)))) : (oldInfo.maxStaff || 2);
            const desc = (document.getElementById("planDesc-" + idx).value || "").trim();
            const benRaw = (document.getElementById("planBen-" + idx).value || "").trim();
            if (Number.isNaN(price) || Number.isNaN(imgs)) { toast("Valeurs numériques invalides."); return; }
            if (newName !== oldName) renameMap[oldName] = newName;
            if (Number(oldInfo.priceHtg) !== price || Number(oldInfo.durationDays || 0) !== durDays) {
              if (!STATE.planPriceHistory) STATE.planPriceHistory = [];
              STATE.planPriceHistory.unshift({
                id: "pph-" + Date.now() + "-" + idx,
                planName: newName,
                oldPriceHtg: Number(oldInfo.priceHtg),
                newPriceHtg: price,
                oldDurationDays: Number(oldInfo.durationDays || 0),
                newDurationDays: durDays,
                changedBy: this._admActor(),
                changedAt: today,
                note: "Anciens paiements conservés à leur montant d'origine"
              });
            }
            next[newName] = {
              ...oldInfo,
              priceHtg: price,
              durationDays: durDays,
              durationLabel: durLbl,
              currency: oldInfo.currency || "HTG",
              maxImages: imgs,
              maxEstablishments: maxEst,
              maxStaff,
              description: desc,
              benefits: benRaw ? benRaw.split(",").map((x) => x.trim()).filter(Boolean) : []
            };
          }
          STATE.plans = next;
          if (Object.keys(renameMap).length) {
            STATE.businesses.forEach((b) => { if (renameMap[b.plan]) b.plan = renameMap[b.plan]; });
          }
          addAudit(this._admActor(), "Forfaits & tarifs mis à jour : " + Object.entries(next).map(([n, v]) => `${n} (${v.priceHtg} HTG / ${v.durationDays}j)`).join(", "));

        _applySubscriptionGrant(bizId, planName, days, reason) {
          const b = getBiz(bizId);
          if (!b) return;
          b.plan = planName;
          b.planStatus = "active";
          const exp = new Date(Date.now() + days * 86400000), p = (n) => String(n).padStart(2, "0");
          const now = new Date();
          b.planExpiresAt = `${exp.getFullYear()}-${p(exp.getMonth() + 1)}-${p(exp.getDate())}`;
          if (!STATE.subscriptionGrants) STATE.subscriptionGrants = [];
          STATE.subscriptionGrants.unshift({
            id: "gr-" + Date.now(),
            targetType: "business",
            targetId: b.id,
            targetName: b.name,
            planName,
            days,
            reason,
            grantedBy: this._admActor(),
            date: `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`,
            excludedFromRevenue: true
          });
          addAudit(this._admActor(), `Abonnement offert (${days}j · ${planName}) accordé à « ${b.name} » (exclu des revenus MonCash)`);
          pushNotification("payment_status", `Abonnement offert ${planName} (+${days}j) activé pour ${b.name}.`, "pro-billing");
          toast(`${days} jours offerts (${planName}) accordés !`);
          render();
        },
        admSetBizPlanStatus(bizId, status) {
          if (!hasAdm("manage_plans")) { toast("Réservé à l'Administrateur principal."); return; }
          const b = getBiz(bizId);
          if (!b) return;
          b.planStatus = status;
          addAudit(this._admActor(), `Abonnement de « ${b.name} » passé à : ${status}`);
          toast("Statut d'abonnement mis à jour.");
          render();
        },
        resetAdminPlans() {
          if (!hasAdm("manage_plans")) { toast("Réservé à l'Administrateur principal."); return; }
          STATE.plans = JSON.parse(JSON.stringify(PLAN_QUOTAS_DEFAULT));
          addAudit(this._admActor(), "Forfaits réinitialisés (Gratuit 0 HTG, Pro 750 HTG, Ultra 1 000 HTG)");
          toast("Forfaits rétablis par défaut.");
          render();
        },
        async admVerifyPayment(payId) {
          if(!isAdminSession()){toast("Accès administrateur requis.");return;}const r=await supabaseClient.rpc("admin_review_payment",{p_payment:payId,p_approve:true,p_note:null});
          if(r.error){toast("Validation impossible : "+r.error.message);return;}await loadZackWorkspace();toast("Paiement validé et abonnement activé.");render();
        },
        async admRejectPayment(payId) {
          if(!isAdminSession()){toast("Accès administrateur requis.");return;}const r=await supabaseClient.rpc("admin_review_payment",{p_payment:payId,p_approve:false,p_note:"Refus après vérification administrative"});
          if(r.error){toast("Refus impossible : "+r.error.message);return;}await loadZackWorkspace();toast("Paiement refusé.");render();
        },
        async admSaveMoncashAcc(e,accId,idx) {
          e.preventDefault();if(!hasAdm("manage_moncash_accounts")){toast("Réservé à l'Administrateur principal.");return;}
          const account=STATE.moncashAccounts.find(x=>x.id===accId);if(!account)return;
          const label=(document.getElementById("mcLbl-"+idx).value||"").trim();
          const phone=(document.getElementById("mcPh-"+idx).value||"").trim();
          const {error}=await supabaseClient.from("payment_recipients").update({label,account_number:phone}).eq("id",accId);
          if(error){toast("Modification impossible : "+error.message);return;}
          await loadZackWorkspace();toast("Destinataire de paiement mis à jour.");render();
        },
        async admSetActiveMoncashAcc(accId) {
          if(!hasAdm("manage_moncash_accounts")){toast("Réservé à l'Administrateur principal.");return;}
          const account=STATE.moncashAccounts.find(x=>x.id===accId);if(!account)return;
          const off=await supabaseClient.from("payment_recipients").update({is_active:false}).eq("provider",account.provider);
          if(off.error){toast("Impossible de désactiver l'ancien numéro : "+off.error.message);return;}
          const on=await supabaseClient.from("payment_recipients").update({is_active:true}).eq("id",accId);
          if(on.error){toast("Impossible d'activer le numéro : "+on.error.message);return;}
          await loadZackWorkspace();toast("Numéro actif mis à jour.");render();
        },
        async admToggleMoncashAcc(accId) {
          if(!hasAdm("manage_moncash_accounts")){toast("Réservé à l'Administrateur principal.");return;}
          const account=STATE.moncashAccounts.find(x=>x.id===accId);if(!account)return;
          if(account.isActiveRecipient){toast("Choisissez d'abord un autre numéro actif pour ce moyen de paiement.");return;}
          const {error}=await supabaseClient.from("payment_recipients").update({is_active:!account.enabled}).eq("id",accId);
          if(error){toast("Modification impossible : "+error.message);return;}
          await loadZackWorkspace();render();
        },
        admAddMoncashAcc(e) {
          e.preventDefault();
          if (!hasAdm("manage_moncash_accounts")) { toast("Réservé à l'Administrateur principal."); return; }
          const label = (document.getElementById("newMcLbl").value || "").trim();
          const phone = (document.getElementById("newMcPh").value || "").trim();
          if (!label || !phone) return;
          STATE.moncashAccounts.push({ id: "mc-" + Date.now(), label, phone, isActiveRecipient: false, enabled: true });
          addAudit(this._admActor(), `Compte MonCash ajouté : ${label} (${phone})`);
          toast("Compte MonCash ajouté !");
          render();
        },
        admSendBroadcast(e) {
          e.preventDefault();
          if (!hasAdm("manage_comm")) { toast("Permission insuffisante."); return; }
          const target = document.getElementById("commTarget").value;
          const title = (document.getElementById("commTitle").value || "").trim();
          const body = (document.getElementById("commBody").value || "").trim();
          if (!title || !body) return;
          pushNotification("system_announcement", `[Zack Officiel] ${title} — ${body}`, "home");
          if (target === "all") {
            const d = new Date(), p = (n) => String(n).padStart(2, "0");
            STATE.officialAnnouncements.unshift({ id: "ann-" + Date.now(), title, target, date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, body });
          }
          addAudit(this._admActor(), `Communication envoyée (${target}) : « ${title} »`);
          toast("Notification & message officiel diffusés (aperçu) !");
          render();
        },
        admReplySupport(e, tkId) {
          e.preventDefault();
          if (!hasAdm("manage_comm")) { toast("Permission insuffisante."); return; }
          const tk = STATE.supportTickets.find((x) => x.id === tkId);
          const rep = (document.getElementById("supRep-" + tkId).value || "").trim();
          if (!tk || !rep) return;
          tk.reply = rep;
          tk.status = "Résolu";
          addAudit(this._admActor(), `Ticket support résolu : « ${tk.subject} »`);
          toast("Réponse enregistrée !");
          render();
        },
        admResolveReport(repId) {
          if (!hasAdm("manage_comm")) { toast("Permission insuffisante."); return; }
          const r = STATE.reports.find((x) => x.id === repId);
          if (!r) return;
          r.status = "Traité";
          addAudit(this._admActor(), `Signalement traité (${r.targetType} · ${r.bizName})`);
          toast("Signalement marqué comme traité.");
          render();
        },
        admAddCategory(e) {
          e.preventDefault();
          if (!hasAdm("manage_categories")) { toast("Permission insuffisante."); return; }
          const name = (document.getElementById("newCatName").value || "").trim();
          const subs = (document.getElementById("newCatSubs").value || "").split(",").map((x) => x.trim()).filter(Boolean);
          if (!name) return;
          const id = "cat-" + Date.now();
          STATE.categories.push({ id, name, active: true, subCategories: subs });
          addAudit(this._admActor(), `Catégorie ajoutée : « ${name} »`);
          toast("Catégorie ajoutée !");
          render();
        },
        admSaveCategory(e, catId, idx) {
          e.preventDefault();
          if (!hasAdm("manage_categories")) { toast("Permission insuffisante."); return; }
          const c = STATE.categories.find((x) => x.id === catId);
          const name = (document.getElementById("catEd-" + idx).value || "").trim();
          if (!c || !name) return;
          c.name = name;
          addAudit(this._admActor(), `Catégorie renommée : « ${name} »`);
          toast("Catégorie renommée.");
          render();
        },
        admToggleCat(catId) {
          if (!hasAdm("manage_categories")) { toast("Permission insuffisante."); return; }
          const c = STATE.categories.find((x) => x.id === catId);
          if (!c) return;
          c.active = c.active === false;
          addAudit(this._admActor(), `Catégorie « ${c.name} » ${c.active ? "activée" : "désactivée"}`);
          render();
        },
        admDeleteCat(catId) {
          if (!hasAdm("manage_categories")) { toast("Permission insuffisante."); return; }
          const used = STATE.businesses.some((b) => b.categoryId === catId);
          if (used) { toast("Impossible de supprimer une catégorie utilisée par des entreprises (désactivez-la plutôt)."); return; }
          const c = STATE.categories.find((x) => x.id === catId);
          STATE.categories = STATE.categories.filter((x) => x.id !== catId);
          addAudit(this._admActor(), `Catégorie supprimée : « ${c ? c.name : catId} »`);
          toast("Catégorie supprimée.");
          render();
        },
        admAddSubCat(e, catId, idx) {
          e.preventDefault();
          if (!hasAdm("manage_categories")) { toast("Permission insuffisante."); return; }
          const c = STATE.categories.find((x) => x.id === catId);
          const val = (document.getElementById("subAdd-" + idx).value || "").trim();
          if (!c || !val) return;
          if (!c.subCategories) c.subCategories = [];
          c.subCategories.push(val);
          addAudit(this._admActor(), `Sous-catégorie « ${val} » ajoutée à « ${c.name} »`);
          render();
        },
        admRemoveSubCat(catId, subIdx) {
          if (!hasAdm("manage_categories")) { toast("Permission insuffisante."); return; }
          const c = STATE.categories.find((x) => x.id === catId);
          if (!c || !c.subCategories) return;
          const removed = c.subCategories.splice(subIdx, 1);
          addAudit(this._admActor(), `Sous-catégorie « ${removed[0] || ""} » retirée de « ${c.name} »`);
          render();
        },
        admSaveSettings(e) {
          e.preventDefault();
          if (!hasAdm("platform_settings")) { toast("Réservé à l'Administrateur principal."); return; }
          STATE.platformSettings = {
            ...STATE.platformSettings,
            officialName: document.getElementById("psName").value.trim(),
            officialEmail: document.getElementById("psMail").value.trim(),
            officialPhone: document.getElementById("psPhone").value.trim(),
            homeBannerTitle: document.getElementById("psBanner").value.trim(),
            showPromosHome: document.getElementById("psShowPromos").checked,
            showEventsHome: document.getElementById("psShowEvents").checked,
            notifPushEnabled: document.getElementById("psNotifPush").checked,
            notifEmailEnabled: document.getElementById("psNotifMail").checked,
            termsSummary: document.getElementById("psTerms").value.trim(),
            privacySummary: document.getElementById("psPriv").value.trim(),
            publishRules: document.getElementById("psRules").value.trim()
          };
          addAudit(this._admActor(), "Paramètres généraux de la plateforme mis à jour");
          toast("Paramètres généraux enregistrés (aperçu local) !");
          render();
        },
        admAddCommune(e) {
          e.preventDefault();
          if (!hasAdm("platform_settings")) { toast("Réservé à l'Administrateur principal."); return; }
          const dept = document.getElementById("geoDept").value;
          const comm = (document.getElementById("geoComm").value || "").trim();
          if (!HAITI_GEO[dept] || !comm) return;
          if (!HAITI_GEO[dept][comm]) HAITI_GEO[dept][comm] = ["Centre-ville"];
          addAudit(this._admActor(), `Commune ajoutée : ${comm} (${dept})`);
          toast(`Commune « ${comm} » ajoutée à ${dept}.`);
          render();
        },
        admAddAdmin(e) {
          e.preventDefault();
          if (!isPrincipalAdmin()) { toast("Réservé à l'Administrateur principal."); return; }
          const name = (document.getElementById("newAdmName").value || "").trim();
          const email = (document.getElementById("newAdmEmail").value || "").trim();
          const perms = Array.from(document.querySelectorAll('input[name="newAdmPerm"]:checked')).map((el) => el.value);
          if (!name || !email) return;
          STATE.admins.push({ id: "adm-" + Date.now(), name, email, isPrincipal: false, roleLabel: "Administrateur ordinaire", active: true, permissions: perms });
          addAudit(this._admActor(), `Administrateur ordinaire ajouté : ${name} (${perms.length} permissions)`);
          toast("Administrateur ordinaire ajouté !");
          render();
        },
        admToggleAdminPerm(admId, permId) {
          if (!isPrincipalAdmin()) { toast("Réservé à l'Administrateur principal."); return; }
          const a = STATE.admins.find((x) => x.id === admId);
          if (!a || a.isPrincipal) return;
          const meta = ADMIN_PERMISSIONS.find((p) => p.id === permId);
          if (meta && meta.principalOnly) { toast("Permission réservée au Principal."); return; }
          const idx = a.permissions.indexOf(permId);
          if (idx >= 0) a.permissions.splice(idx, 1);
          else a.permissions.push(permId);
          addAudit(this._admActor(), `Permission « ${permId} » ${idx >= 0 ? "retirée à" : "accordée à"} ${a.name}`);
          render();
        },
        admToggleAdminActive(admId) {
          if (!isPrincipalAdmin()) { toast("Réservé à l'Administrateur principal."); return; }
          const a = STATE.admins.find((x) => x.id === admId);
          if (!a || a.isPrincipal) return;
          a.active = a.active === false;
          addAudit(this._admActor(), `Accès admin de ${a.name} ${a.active ? "réactivé" : "suspendu"}`);
          render();
        },
        admRemoveAdmin(admId) {
          if (!isPrincipalAdmin()) { toast("Réservé à l'Administrateur principal."); return; }
          const a = STATE.admins.find((x) => x.id === admId);
          if (!a || a.isPrincipal) return;
          STATE.admins = STATE.admins.filter((x) => x.id !== admId);
          addAudit(this._admActor(), `Administrateur ordinaire retiré : ${a.name}`);
          toast("Administrateur retiré.");
          render();
        },
        admSetStatus(id, s) {
          this.admBizAction(id, s === "verified" ? "verify" : s === "suspended" ? "suspend" : "reject");
        },

        /* PARTAGE NATIF + WHATSAPP + COPIE (SÉCURISÉ PAR ID) */
        async shareEntity(type, id) {
          let title = "Zack Haïti", details = "";
          if (type === "biz") {
            const b = getBiz(id);
            if (!b) return;
            title = b.name;
            details = `${getCatName(b.categoryId)} — ${b.commune}, ${b.dept}`;
          } else if (type === "product") {
            const p = STATE.products.find((x) => x.id === id);
            if (!p) return;
            title = p.name;
            details = `${p.priceHtg.toLocaleString("fr-FR")} HTG`;
          } else if (type === "service") {
            const s = STATE.services.find((x) => x.id === id);
            if (!s) return;
            title = s.name;
            details = s.onQuote ? "Prix sur demande" : `${s.priceHtg.toLocaleString("fr-FR")} HTG`;
          } else if (type === "promo") {
            const pr = STATE.promotions.find((x) => x.id === id);
            if (!pr) return;
            title = pr.title;
            details = `${pr.newHtg.toLocaleString("fr-FR")} HTG (jusqu'au ${pr.end})`;
          } else if (type === "event") {
            const ev = STATE.events.find((x) => x.id === id);
            if (!ev) return;
            title = ev.title;
            details = `${ev.date} · ${ev.place}`;
          }
          const shareText = `${title}${details ? " (" + details + ")" : ""} — sur Zack Haïti`;
          STATE.lastShareText = shareText;
          const shareUrl = window.location.href.startsWith("http") ? window.location.href : "https://zack.ht";
          if (navigator.share) {
            try {
              await navigator.share({ title, text: shareText, url: shareUrl });
              return;
            } catch (_) {}
          }
          const waUrl = "https://wa.me/?text=" + encodeURIComponent(shareText + " — " + shareUrl);
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Partager</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <p class="small muted" style="margin-bottom:12px;">${esc(shareText)}</p>
            <div class="form-stack">
              <a class="btn btn-success btn-block" href="${waUrl}" target="_blank" rel="noopener noreferrer">Partager sur WhatsApp</a>
              <button type="button" class="btn btn-navy btn-block" onclick="app.copyShareText()">Copier le texte</button>
            </div>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },
        copyShareText() {
          if (navigator.clipboard && STATE.lastShareText) navigator.clipboard.writeText(STATE.lastShareText).catch(() => {});
          this.closeDrawer();
          toast("Texte copié pour partage !");
        },

        /* INSTALLATION PWA / APK */
        async triggerPwaInstall() {
          if (STATE.deferredPwaPrompt) {
            STATE.deferredPwaPrompt.prompt();
            await STATE.deferredPwaPrompt.userChoice;
            STATE.deferredPwaPrompt = null;
            return;
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "ZACK_TRIGGER_PWA_INSTALL" }, "*");
          }
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Installer Zack (PWA / APK)</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <div class="notice notice-info" style="margin-bottom:10px;">
              <strong>Prérequis technique :</strong> ce fichier HTML autonome doit être hébergé en <strong>HTTPS</strong> avec un fichier <code>manifest.webmanifest</code>, des icônes PNG et un Service Worker (<code>sw.js</code>) pour déclencher l'installation PWA native et générer un APK.
            </div>
            <div class="form-stack small muted">
              <p><strong>Android (Chrome) :</strong> Menu (⋮) → <em>Installer l'application</em> ou <em>Ajouter à l'écran d'accueil</em>.</p>
              <p><strong>iPhone / iPad (Safari) :</strong> Icône <em>Partager</em> → <em>Sur l'écran d'accueil</em>.</p>
              <p><strong>Générer le fichier .apk :</strong> une fois le manifest et le Service Worker en ligne en HTTPS, utilisez <em>PWABuilder</em> ou <em>Bubblewrap</em>.</p>
            </div>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },

        openSpaceDrawer() {
          lastFocusedEl = document.activeElement;
          document.getElementById("drawerSheet").innerHTML = `
            <div class="flex-between" style="margin-bottom:10px;"><strong>Zack Haïti · Espaces</strong><button type="button" class="btn btn-outline btn-sm" onclick="app.closeDrawer()">Fermer</button></div>
            <div class="form-stack">
              <button type="button" class="btn btn-navy btn-block" onclick="app.closeDrawer(); app.switchRoot('home');">${esc(t("public_space"))}</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.switchSpace('client');">${esc(t("personal_space"))}</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.switchSpace('pro');">Professionnel indépendant</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.switchSpace('courier');">Espace Livreur (100% gratuit)</button>
              <button type="button" class="btn btn-primary btn-block" onclick="app.closeDrawer(); app.switchSpace('business');">${esc(t("pro_space"))}</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.open('network-home');">Réseau Zack (10 relations)</button>
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.open('b2b-market');">Marché Pro B2B & Emplois</button>
              ${isAdminSession() ? `<button type="button" class="btn btn-yellow btn-block" onclick="app.closeDrawer(); app.switchSpace('admin');">${esc(t("admin_space"))}</button>` : ""}
              <button type="button" class="btn btn-outline btn-block" onclick="app.closeDrawer(); app.switchRoot('auth');">Page de connexion</button>
              <div class="grid-2">
                <select class="select" aria-label="Langue" onchange="app.setLang(this.value)"><option value="fr" ${STATE.lang==='fr'?'selected':''}>Français</option><option value="ht" ${STATE.lang==='ht'?'selected':''}>Kreyòl</option></select>
                <select class="select" aria-label="Thème" onchange="app.setTheme(this.value)"><option value="auto" ${STATE.theme==='auto'?'selected':''}>Auto</option><option value="light" ${STATE.theme==='light'?'selected':''}>Clair</option><option value="dark" ${STATE.theme==='dark'?'selected':''}>Sombre</option></select>
              </div>
            </div>
          `;
          document.getElementById("drawerOverlay").classList.add("open");
          document.getElementById("drawerSheet").focus();
        },
        closeDrawer() {
          document.getElementById("drawerOverlay").classList.remove("open");
          if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
            lastFocusedEl.focus();
            lastFocusedEl = null;
          }
        }
      };

      function render() {
        renderHeader();
        renderBottomNav();
        const body = document.getElementById("screenBody");
        const s = STATE.screen;
        let html = "";
        if (s.startsWith("admin-") && !isAdminSession()) html = viewHome();
        else if (s === "auth") html = viewAuth();
        else if (s === "home") html = viewHome();
        else if (s === "explore") html = viewExplore();
        else if (s === "promos") html = viewPromos();
        else if (s === "events") html = viewEvents();
        else if (s === "biz-detail") html = viewBizDetail();
        else if (s === "prod-detail") html = viewProdDetail();
        else if (s === "cart") html = viewCart();
        else if (s === "messages-list") html = viewMessagesList();
        else if (s === "messages-chat") html = viewMessagesChat();
        else if (s === "personal-menu") html = viewPersonalMenu();
        else if (s.startsWith("personal-")) html = viewPersonalSub(s);
        else if (s === "pro-dashboard") html = viewProDashboard();
        else if (s === "pro-indep-dashboard") html = viewProIndepDashboard();
        else if (s === "courier-space") html = viewCourierSpace();
        else if (s === "network-home") html = viewNetworkHome();
        else if (s === "b2b-market") html = viewB2bMarket();
        else if (s === "pro-publish") html = viewProPublish();
        else if (s.startsWith("pro-")) html = viewProSub(s);
        else if (s === "admin-menu") html = viewAdminMenu();
        else if (s.startsWith("admin-")) html = viewAdminSub(s);
        else html = viewAuth();

        body.innerHTML = html;
        if (s === "messages-chat") body.scrollTop = body.scrollHeight;
        else body.scrollTop = 0;
        if (s === "pro-create") { const d = document.getElementById("nbDept"); if (d) window.app.fillComm(d.value); }
      }

      applyTheme();
      render();
      initializeSupabaseAuth();
    })();
  </script>
